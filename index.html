<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Generator & Database SPK Konstruksi - PT Bangun Cinta Alam</title>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @media print {
            body {
                background-color: white !important;
                color: black !important;
                font-size: 11pt !important;
            }
            .print-hidden {
                display: none !important;
            }
            @page {
                /* MARGIN ATAS SUDAH DIPERKECIL MENJADI 10mm */
                margin: 10mm 15mm 20mm 15mm;
            }
            thead {
                display: table-header-group !important;
            }
            tbody {
                display: table-row-group !important;
            }
            tr {
                page-break-inside: avoid !important;
            }
        }
        
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.03);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased pb-12 print:p-0 print:bg-white print:text-black">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Daftar Proyek & Lokasi
        const DAFTAR_PROYEK = [
            { nama: "Cinta Alam Residence - Ngenep, Karangploso", lokasi: "Ngenep, Karangploso, Malang", kode: "CAR" },
            { nama: "Green Blossom Residence - Kepuharjo, Karangploso", lokasi: "Kepuharjo, Karangploso, Malang", kode: "GBR" },
            { nama: "Griya Pesona Kejayan - Sumberbanteng, Kejayan", lokasi: "Sumberbanteng, Kejayan, Pasuruan", kode: "GPK" },
            { nama: "Harmoni Cluster - Mendalanwangi, Wagir", lokasi: "Mendalanwangi, Wagir, Malang", kode: "HC" },
            { nama: "Kantor Dawuhan - Tegalgondo, Karangploso", lokasi: "Tegalgondo, Karangploso, Malang", kode: "KD" },
            { nama: "Lembah Bunder Regency - Sidorahayu, Wagir", lokasi: "Sidorahayu, Wagir, Malang", kode: "LBR" },
            { nama: "Sekarputih - Junrejo, Batu", lokasi: "Junrejo, Batu", kode: "SP" },
            { nama: "Villa Royalle Orchid - Kepuharjo, Karangploso", lokasi: "Kepuharjo, Karangploso, Malang", kode: "VRO" }
        ];

        // Daftar Penanggungjawab & Jabatan
        const DAFTAR_PENANGGUNGJAWAB = [
            { nama: "Achmadi", jabatan: "Pengawas Lapangan All Proyek" },
            { nama: "Agus Sutanto", jabatan: "Pengawas Lapangan" },
            { nama: "Busro Khufidon", jabatan: "Logistik" },
            { nama: "Muhammad Taufiq", jabatan: "Pengawas Lapangan Bagian Fasum" },
            { nama: "Muhammad Yuda", jabatan: "Kepala Tukang Alumunium" },
            { nama: "Supardi", jabatan: "Quality Control Unit" },
            { nama: "Wahyu (Daok)", jabatan: "Pengawas Lapangan" }
        ];

        // Helper Angka Romawi untuk Bulan
        const getRomanMonth = (monthNumber) => {
            const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
            return roman[monthNumber] || "I";
        };

        // Hitung Hari Kerja (Kecuali Hari Minggu)
        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const startDate = new Date(start);
            const endDate = new Date(end);
            if (endDate < startDate) return 0;

            let count = 0;
            let curDate = new Date(startDate.getTime());
            while (curDate <= endDate) {
                const dayOfWeek = curDate.getDay();
                if (dayOfWeek !== 0) { // 0 = Minggu
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        };

        // Data Default Awal untuk Reset
        const DEFAULT_STATE = {
            selectedProyekIdx: "",
            pemberiTugas: "Farizal Zainur Rozikin", 
            selectedPjIdx: "",
            startDate: "", 
            endDate: "", 
            isManualSpk: false,
            ruangLingkup: [], 
            materials: [], 
            laborType: "harian",
            laborHarian: [
                { id: "1", tenaga: "Tukang", satuan: "Hari/Orang", volume: "", harga: "" },
                { id: "2", tenaga: "Kuli", satuan: "Hari/Orang", volume: "", harga: "" }
            ],
            laborBorongan: [], 
            keuanganName: "Sita Dita C",
            kepalaKantorName: "Fika Faradila C"
        };

        function App() {
            // Database SPK Tersimpan di Memori Lokal Browser
            const [daftarSpk, setDaftarSpk] = useState(() => {
                const saved = localStorage.getItem('BCA_DAFTAR_SPK');
                return saved ? JSON.parse(saved) : [];
            });
            const [activeSpkId, setActiveSpkId] = useState(null);

            // State Dokumen saat ini
            const [selectedProyekIdx, setSelectedProyekIdx] = useState(DEFAULT_STATE.selectedProyekIdx);
            const [pemberiTugas, setPemberiTugas] = useState(DEFAULT_STATE.pemberiTugas);
            const [selectedPjIdx, setSelectedPjIdx] = useState(DEFAULT_STATE.selectedPjIdx);
            const [startDate, setStartDate] = useState(DEFAULT_STATE.startDate);
            const [endDate, setEndDate] = useState(DEFAULT_STATE.endDate);
            const [spkNumber, setSpkNumber] = useState("");
            const [isManualSpk, setIsManualSpk] = useState(DEFAULT_STATE.isManualSpk);

            // Kop Surat State
            const [instansiName, setInstansiName] = useState("PT. BANGUN CINTA ALAM");
            const [instansiAddress, setInstansiAddress] = useState("Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
            const [logoKiri, setLogoKiri] = useState(null);
            const [logoKanan, setLogoKanan] = useState(null);

            // Pekerjaan, Material & Tenaga Kerja State
            const [ruangLingkup, setRuangLingkup] = useState(DEFAULT_STATE.ruangLingkup);
            const [materials, setMaterials] = useState(DEFAULT_STATE.materials);
            const [laborType, setLaborType] = useState(DEFAULT_STATE.laborType);
            const [laborHarian, setLaborHarian] = useState(DEFAULT_STATE.laborHarian);
            const [laborBorongan, setLaborBorongan] = useState(DEFAULT_STATE.laborBorongan);

            // Penandatanganan State
            const [keuanganName, setKeuanganName] = useState(DEFAULT_STATE.keuanganName);
            const [kepalaKantorName, setKepalaKantorName] = useState(DEFAULT_STATE.kepalaKantorName);

            // State Notifikasi popup
            const [notification, setNotification] = useState(null);

            const previewRef = useRef(null);

            // Sync ke LocalStorage
            useEffect(() => {
                localStorage.setItem('BCA_DAFTAR_SPK', JSON.stringify(daftarSpk));
            }, [daftarSpk]);

            // Selalu trigger Lucide Icons rendering
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // Generate Nomor SPK secara otomatis saat parameter berubah
            useEffect(() => {
                if (!isManualSpk) {
                    if (startDate && selectedProyekIdx !== "") {
                        const dateObj = new Date(startDate);
                        const monthRoman = getRomanMonth(dateObj.getMonth());
                        const year = dateObj.getFullYear();
                        const proyek = DAFTAR_PROYEK[selectedProyekIdx];
                        const projectCode = proyek ? proyek.kode : "PROYEK";
                        
                        const generated = `042/BCA-SPK/${monthRoman}/${projectCode}-${year}`;
                        setSpkNumber(generated);
                    } else {
                        setSpkNumber(""); // Kosongkan nomor SPK jika form belum diisi
                    }
                }
            }, [selectedProyekIdx, startDate, isManualSpk]);

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => {
                    setNotification(null);
                }, 4000);
            };

            const handleResetData = () => {
                setSelectedProyekIdx(DEFAULT_STATE.selectedProyekIdx);
                setPemberiTugas(DEFAULT_STATE.pemberiTugas);
                setSelectedPjIdx(DEFAULT_STATE.selectedPjIdx);
                setStartDate(DEFAULT_STATE.startDate);
                setEndDate(DEFAULT_STATE.endDate);
                setIsManualSpk(DEFAULT_STATE.isManualSpk);
                setSpkNumber("");
                setRuangLingkup(JSON.parse(JSON.stringify(DEFAULT_STATE.ruangLingkup)));
                setMaterials(JSON.parse(JSON.stringify(DEFAULT_STATE.materials)));
                setLaborType(DEFAULT_STATE.laborType);
                setLaborHarian(JSON.parse(JSON.stringify(DEFAULT_STATE.laborHarian)));
                setLaborBorongan(JSON.parse(JSON.stringify(DEFAULT_STATE.laborBorongan)));
                setKeuanganName(DEFAULT_STATE.keuanganName);
                setKepalaKantorName(DEFAULT_STATE.kepalaKantorName);
                
                // Kembalikan kop surat ke default
                setInstansiName("PT. BANGUN CINTA ALAM");
                setInstansiAddress("Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
                
                setActiveSpkId(null);
                showNotification("Semua formulir input berhasil dikosongkan!", "info");
            };

            const handlePreviewScroll = () => {
                if (previewRef.current) {
                    previewRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    showNotification("Menampilkan Pratinjau Dokumen SPK.", "info");
                }
            };

            const handleSaveSpk = () => {
                if(selectedProyekIdx === "") {
                    showNotification("Harap pilih nama proyek terlebih dahulu!", "error");
                    return;
                }

                const dataSpk = {
                    id: activeSpkId || Date.now().toString(),
                    spkNumber,
                    proyekIdx: selectedProyekIdx,
                    proyekNama: DAFTAR_PROYEK[selectedProyekIdx]?.nama,
                    pemberiTugas,
                    pjIdx: selectedPjIdx,
                    startDate,
                    endDate,
                    ruangLingkup,
                    materials,
                    laborType,
                    laborHarian,
                    laborBorongan,
                    keuanganName,
                    kepalaKantorName,
                    instansiName,
                    instansiAddress,
                    lastUpdated: new Date().toLocaleString('id-ID')
                };

                if (activeSpkId) {
                    setDaftarSpk(daftarSpk.map(item => item.id === activeSpkId ? dataSpk : item));
                    showNotification("Draf SPK berhasil diperbarui!");
                } else {
                    setDaftarSpk([...daftarSpk, dataSpk]);
                    setActiveSpkId(dataSpk.id);
                    showNotification("SPK baru berhasil disimpan!");
                }
            };

            const handleLoadSpk = (id) => {
                const target = daftarSpk.find(item => item.id === id);
                if (target) {
                    setActiveSpkId(target.id);
                    setSpkNumber(target.spkNumber || "");
                    setSelectedProyekIdx(target.proyekIdx !== undefined ? target.proyekIdx : "");
                    setPemberiTugas(target.pemberiTugas || "");
                    setSelectedPjIdx(target.pjIdx !== undefined ? target.pjIdx : "");
                    setStartDate(target.startDate || "");
                    setEndDate(target.endDate || "");
                    setRuangLingkup(target.ruangLingkup || []);
                    setMaterials(target.materials || []);
                    setLaborType(target.laborType || "harian");
                    setLaborHarian(target.laborHarian || []);
                    setLaborBorongan(target.laborBorongan || []);
                    setKeuanganName(target.keuanganName || "");
                    setKepalaKantorName(target.kepalaKantorName || "");
                    
                    setInstansiName(target.instansiName || "PT. BANGUN CINTA ALAM");
                    setInstansiAddress(target.instansiAddress || "Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
                    
                    setIsManualSpk(true);

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    showNotification(`Memuat dokumen SPK: ${target.spkNumber}`);
                }
            };

            const handleDeleteSpk = (id, e) => {
                e.stopPropagation();
                setDaftarSpk(daftarSpk.filter(item => item.id !== id));
                if (activeSpkId === id) {
                    setActiveSpkId(null);
                }
                showNotification("Dokumen SPK berhasil dihapus.", "error");
            };

            const handleLogoUpload = (e, target) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        if (target === 'kiri') setLogoKiri(reader.result);
                        if (target === 'kanan') setLogoKanan(reader.result);
                    };
                    reader.readAsDataURL(file);
                }
            };

            const clearLogo = (target) => {
                if (target === 'kiri') setLogoKiri(null);
                if (target === 'kanan') setLogoKanan(null);
            };

            const durasiHari = (startDate && endDate) ? calculateWorkingDays(startDate, endDate) : 0;

            // --- CRUD RUANG LINGKUP ---
            const addRuangLingkup = () => {
                const newId = Date.now().toString();
                setRuangLingkup([...ruangLingkup, {
                    id: newId,
                    uraian: "",
                    volume: "",
                    satuan: "",
                    subs: []
                }]);
            };

            const updateRuangLingkup = (index, field, value) => {
                const updated = [...ruangLingkup];
                updated[index][field] = value;
                setRuangLingkup(updated);
            };

            const removeRuangLingkup = (index) => {
                setRuangLingkup(ruangLingkup.filter((_, i) => i !== index));
            };

            const addSubPekerjaan = (parentIdx) => {
                const updated = [...ruangLingkup];
                const parent = updated[parentIdx];
                const subId = `${parent.id}-${parent.subs.length + 1}`;
                parent.subs.push({
                    id: subId,
                    uraian: "",
                    volume: "",
                    satuan: ""
                });
                setRuangLingkup(updated);
            };

            const updateSubPekerjaan = (parentIdx, subIdx, field, value) => {
                const updated = [...ruangLingkup];
                updated[parentIdx].subs[subIdx][field] = value;
                setRuangLingkup(updated);
            };

            const removeSubPekerjaan = (parentIdx, subIdx) => {
                const updated = [...ruangLingkup];
                updated[parentIdx].subs = updated[parentIdx].subs.filter((_, i) => i !== subIdx);
                setRuangLingkup(updated);
            };

            // --- CRUD MATERIAL ---
            const addMaterial = () => {
                setMaterials([...materials, {
                    id: Date.now().toString(),
                    nama: "",
                    qty: "",
                    satuan: "",
                    harga: ""
                }]);
            };

            const updateMaterial = (index, field, value) => {
                const updated = [...materials];
                updated[index][field] = value;
                setMaterials(updated);
            };

            const removeMaterial = (index) => {
                setMaterials(materials.filter((_, i) => i !== index));
            };

            const totalMaterial = materials.reduce((acc, curr) => acc + ((Number(curr.qty) || 0) * (Number(curr.harga) || 0)), 0);

            // --- CRUD TENAGA KERJA ---
            const addLaborHarian = () => {
                setLaborHarian([...laborHarian, {
                    id: Date.now().toString(),
                    tenaga: "",
                    satuan: "Hari/Orang",
                    volume: "",
                    harga: ""
                }]);
            };

            const updateLaborHarian = (index, field, value) => {
                const updated = [...laborHarian];
                updated[index][field] = value;
                setLaborHarian(updated);
            };

            const removeLaborHarian = (index) => {
                setLaborHarian(laborHarian.filter((_, i) => i !== index));
            };

            const addLaborBorongan = () => {
                setLaborBorongan([...laborBorongan, {
                    id: Date.now().toString(),
                    uraian: "",
                    volume: "",
                    satuan: "",
                    harga: ""
                }]);
            };

            const updateLaborBorongan = (index, field, value) => {
                const updated = [...laborBorongan];
                updated[index][field] = value;
                setLaborBorongan(updated);
            };

            const removeLaborBorongan = (index) => {
                setLaborBorongan(laborBorongan.filter((_, i) => i !== index));
            };

            const totalLabor = laborType === 'harian' 
                ? laborHarian.reduce((acc, curr) => acc + ((Number(curr.volume) || 0) * (Number(curr.harga) || 0)), 0)
                : laborBorongan.reduce((acc, curr) => acc + ((Number(curr.volume) || 0) * (Number(curr.harga) || 0)), 0);

            const grandTotal = totalMaterial + totalLabor;

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 font-sans antialiased pb-12 print:p-0 print:bg-white print:text-black">
                    
                    {/* NOTIFIKASI POPUP */}
                    {notification && (
                        <div className={`fixed bottom-5 right-5 z-50 flex items-center gap-3 px-5 py-3 rounded-lg shadow-xl border transition-all animate-bounce ${
                            notification.type === 'error' ? 'bg-red-500/20 text-red-200 border-red-500/30' : 
                            notification.type === 'info' ? 'bg-amber-500/20 text-amber-200 border-amber-500/30' :
                            'bg-emerald-500/20 text-emerald-200 border-emerald-500/30'
                        }`}>
                            <i data-lucide="alert-circle" class="w-5 h-5 shrink-0"></i>
                            <span className="text-sm font-semibold">{notification.message}</span>
                        </div>
                    )}

                    {/* HEADER CONTROL BAR (Hidden during Print) */}
                    <header className="bg-slate-950 border-b border-slate-800 py-4 px-6 sticky top-0 z-40 shadow-lg print:hidden">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                            <div className="flex items-center gap-3">
                                <div className="p-2.5 bg-sky-600/10 rounded-lg text-sky-400 border border-sky-500/20">
                                    <i data-lucide="building-2" class="w-6 h-6"></i>
                                </div>
                                <div>
                                    <h1 className="font-bold text-lg tracking-wide text-white">SPK GENERATOR & DATABASE</h1>
                                    <p className="text-xs text-slate-400">PT Bangun Cinta Alam • Konstruksi Proyek</p>
                                </div>
                            </div>
                            
                            {/* AKSI KONTROL UTAMA */}
                            <div className="flex items-center gap-3 flex-wrap w-full md:w-auto">
                                <button 
                                    onClick={handleResetData}
                                    className="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-750 text-slate-300 font-semibold px-4 py-2.5 rounded-lg border border-slate-700 transition-all text-xs"
                                >
                                    <i data-lucide="rotate-ccw" class="w-4 h-4 text-slate-400"></i>
                                    Reset Data
                                </button>
                                
                                <button 
                                    onClick={handlePreviewScroll}
                                    className="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-750 text-slate-300 font-semibold px-4 py-2.5 rounded-lg border border-slate-700 transition-all text-xs"
                                >
                                    <i data-lucide="eye" class="w-4 h-4 text-sky-400"></i>
                                    Pratinjau
                                </button>

                                <button 
                                    onClick={handleSaveSpk}
                                    className="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold px-4 py-2.5 rounded-lg transition-all text-xs"
                                >
                                    <i data-lucide="save" class="w-4 h-4"></i>
                                    {activeSpkId ? "Update SPK" : "Simpan SPK"}
                                </button>

                                <button 
                                    onClick={() => window.print()}
                                    className="flex-1 md:flex-initial flex items-center justify-center gap-2 bg-gradient-to-r from-sky-600 to-blue-700 hover:from-sky-500 hover:to-blue-600 text-white font-semibold px-5 py-2.5 rounded-lg shadow-lg transition-all active:scale-95 text-xs"
                                >
                                    <i data-lucide="printer" class="w-4 h-4"></i>
                                    Cetak / PDF
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTAINER */}
                    <div className="max-w-7xl mx-auto px-4 md:px-6 py-6 grid grid-cols-1 lg:grid-cols-12 gap-6 print:p-0 print:block">
                        
                        {/* LEFT COLUMN: CONTROL PANEL & SPK DATABASE MENU */}
                        <aside className="lg:col-span-5 space-y-6 print:hidden">
                            
                            {/* MENU: SPK DATABASE MANAGER */}
                            <div className="bg-slate-950/80 border border-slate-800 rounded-xl p-5 backdrop-blur-sm shadow-xl">
                                <div className="flex items-center gap-2 mb-4 border-b border-slate-800 pb-3 justify-between">
                                    <div className="flex items-center gap-2">
                                        <i data-lucide="folder-open" class="w-5 h-5 text-sky-400"></i>
                                        <h2 className="font-semibold text-slate-200">Database SPK Lokal</h2>
                                    </div>
                                    <span className="bg-sky-500/10 text-sky-400 border border-sky-500/20 text-[10px] px-2 py-0.5 rounded font-bold">
                                        {daftarSpk.length} Tersimpan
                                    </span>
                                </div>

                                {daftarSpk.length === 0 ? (
                                    <div className="text-center py-6 bg-slate-900/40 rounded-lg border border-slate-800/80">
                                        <p className="text-xs text-slate-500 font-medium">Belum ada dokumen SPK yang disimpan.</p>
                                        <p className="text-[10px] text-slate-600 mt-1">Klik tombol "Simpan SPK" untuk mengarsipkan.</p>
                                    </div>
                                ) : (
                                    <div className="space-y-2 max-h-56 overflow-y-auto pr-1 custom-scrollbar">
                                        {daftarSpk.map((item) => (
                                            <div 
                                                key={item.id}
                                                onClick={() => handleLoadSpk(item.id)}
                                                className={`p-3 rounded-lg border text-left transition-all cursor-pointer flex justify-between items-center ${
                                                    activeSpkId === item.id 
                                                        ? 'bg-sky-950/40 border-sky-500 text-sky-200' 
                                                        : 'bg-slate-900/60 border-slate-800 hover:border-slate-700 text-slate-300'
                                                }`}
                                            >
                                                <div className="space-y-1 min-w-0 flex-1 pr-2">
                                                    <h4 className="text-xs font-bold font-mono tracking-wide truncate">{item.spkNumber || "Draf SPK"}</h4>
                                                    <p className="text-[10px] text-slate-400 truncate font-semibold">{item.proyekNama || "Belum ada nama proyek"}</p>
                                                    <span className="text-[9px] text-slate-500 block">Diedit: {item.lastUpdated}</span>
                                                </div>
                                                <div className="flex items-center gap-1 shrink-0">
                                                    <button 
                                                        onClick={(e) => { e.stopPropagation(); handleLoadSpk(item.id); }}
                                                        className="p-1.5 text-sky-400 hover:bg-sky-500/10 rounded transition-colors"
                                                    >
                                                        <i data-lucide="edit" class="w-3.5 h-3.5"></i>
                                                    </button>
                                                    <button 
                                                        onClick={(e) => handleDeleteSpk(item.id, e)}

                                                                                <td className="py-1.5 px-3 text-right font-mono font-bold">{((Number(lab.volume)||0) * (Number(lab.harga)||0)).toLocaleString('id-ID')}</td>
                                                                            </tr>
                                                                        ))}
                                                                        <tr className="bg-slate-100 font-bold border-t border-slate-400 text-slate-950">
                                                                            <td colSpan="5" className="py-2 px-3 text-right border-r border-slate-300">Sub-Total Biaya Tenaga Kerja:</td>
                                                                            <td className="py-2 px-3 text-right font-mono text-xs">Rp. {totalLabor.toLocaleString('id-ID')}</td>
                                                                        </tr>
                                                                    </tbody>
                                                                </table>
                                                            ) : (
                                                                laborBorongan.length === 0 ? (
                                                                    <div className="p-3 border-t border-slate-300 text-[11px] text-slate-500 italic text-center">
                                                                        Daftar biaya tenaga borongan belum ditambahkan.
                                                                    </div>
                                                                ) : (
                                                                    <table className="w-full text-left text-[11px] border-collapse">
                                                                        <thead>
                                                                            <tr className="bg-slate-50 border-b border-slate-800 text-slate-900 font-bold">
                                                                                <th className="py-2 px-3 border-r border-slate-300 w-12 text-center">No.</th>
                                                                                <th className="py-2 px-3 border-r border-slate-300">Uraian Pekerjaan Borongan</th>
                                                                                <th className="py-2 px-3 border-r border-slate-300 w-24 text-center">Volume</th>
                                                                                <th className="py-2 px-3 border-r border-slate-300 w-24 text-center">Satuan</th>
                                                                                <th className="py-2 px-3 border-r border-slate-300 w-28 text-right">Harga Satuan (Rp)</th>
                                                                                <th className="py-2 px-3 w-28 text-right">Total Harga (Rp)</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {laborBorongan.map((lab, idx) => (
                                                                                <tr key={lab.id} className="border-b border-slate-300 hover:bg-slate-50">
                                                                                    <td className="py-1.5 px-3 border-r border-slate-300 text-center font-mono">{idx + 1}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-300 text-slate-800">{lab.uraian || `Borongan #${idx+1}`}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-300 text-center">{lab.volume || "-"}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-300 text-center">{lab.satuan || "-"}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-300 text-right font-mono">{(Number(lab.harga)||0).toLocaleString('id-ID')}</td>
                                                                                    <td className="py-1.5 px-3 text-right font-mono font-bold">{((Number(lab.volume)||0) * (Number(lab.harga)||0)).toLocaleString('id-ID')}</td>
                                                                                </tr>
                                                                            ))}
                                                                            <tr className="bg-slate-100 font-bold border-t border-slate-400 text-slate-950">
                                                                                <td colSpan="5" className="py-2 px-3 text-right border-r border-slate-300">Sub-Total Biaya Tenaga Kerja:</td>
                                                                                <td className="py-2 px-3 text-right font-mono text-xs">Rp. {totalLabor.toLocaleString('id-ID')}</td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                )
                                                            )}
                                                        </div>
                                                    </div>

                                                    {/* GRAND TOTAL */}
                                                    <div className="bg-slate-900 text-white p-3.5 rounded border border-slate-950 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 print:bg-slate-100 print:text-black print:border-slate-400">
                                                        <div>
                                                            <h3 className="text-xs font-bold uppercase tracking-wider text-slate-300 print:text-slate-800">Grand Total Pengeluaran Pekerjaan</h3>
                                                            <p className="text-[10px] text-slate-400 print:text-slate-600 mt-0.5">Akumulasi Biaya Material + Biaya Tenaga Kerja</p>
                                                        </div>
                                                        <div className="text-right">
                                                            <span className="text-sm font-bold text-slate-400 print:text-slate-700 mr-2">Total Akhir:</span>
                                                            <span className="text-lg font-black font-mono tracking-wide text-sky-400 print:text-slate-900">
                                                                Rp. {grandTotal.toLocaleString('id-ID')}
                                                            </span>
                                                        </div>
                                                    </div>

                                                    {/* PENANDATANGANAN - SEKARANG MENGGUNAKAN print:grid-cols-4 */}
                                                    <div className="pt-8 space-y-4 print:pt-6">
                                                        <div className="grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 gap-4 text-[11px] text-center">
                                                            <div className="flex flex-col justify-between h-32 p-2 border border-dashed border-slate-300 rounded print:border-none">
                                                                <span className="font-bold text-slate-900 uppercase tracking-tight">Pemberi Tugas</span>
                                                                <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan & Stempel</div>
                                                                <div>
                                                                    <span className="font-black underline text-slate-950 block">{pemberiTugas}</span>
                                                                    <span className="text-[10px] text-slate-500 block">Direktur</span>
                                                                </div>
                                                            </div>

                                                            <div className="flex flex-col justify-between h-32 p-2 border border-dashed border-slate-300 rounded print:border-none">
                                                                <span className="font-bold text-slate-900 uppercase tracking-tight">Keuangan</span>
                                                                <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan & Stempel</div>
                                                                <div>
                                                                    <span className="font-black underline text-slate-950 block">{keuanganName}</span>
                                                                    <span className="text-[10px] text-slate-500 block">Staff Finance</span>
                                                                </div>
                                                            </div>

                                                            <div className="flex flex-col justify-between h-32 p-2 border border-dashed border-slate-300 rounded print:border-none">
                                                                <span className="font-bold text-slate-900 uppercase tracking-tight">Penanggung Jawab</span>
                                                                <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan & Stempel</div>
                                                                <div>
                                                                    <span className="font-black underline text-slate-950 block">{selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.nama : "-"}</span>
                                                                    <span className="text-[10px] text-slate-500 block truncate" title={selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.jabatan : ""}>
                                                                        {selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.jabatan : "-"}
                                                                    </span>
                                                                </div>
                                                            </div>

                                                            <div className="flex flex-col justify-between h-32 p-2 border border-dashed border-slate-300 rounded print:border-none">
                                                                <span className="font-bold text-slate-900 uppercase tracking-tight">Kepala Kantor</span>
                                                                <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan & Stempel</div>
                                                                <div>
                                                                    <span className="font-black underline text-slate-950 block">{kepalaKantorName}</span>
                                                                    <span className="text-[10px] text-slate-500 block">Branch Manager</span>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>

                                                </div>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                            </div>
                        </main>
                    </div>

                    <footer className="text-center text-xs text-slate-500 mt-12 print:hidden">
                        <p>© 2026 PT Bangun Cinta Alam. Sistem Penomoran SPK Otomatis.</p>
                    </footer>
                </div>
            );
        }

        // Inisialisasi React & Rendering
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
