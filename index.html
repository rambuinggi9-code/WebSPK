        const DAFTAR_PENANGGUNGJAWAB = [

        // Helper Angka Romawi untuk Bulan
        const getRomanMonth = (monthNumber) => {
            const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
            return roman[monthNumber] || "I";
        };

        // Hitung Hari Kerja (Kecuali Hari Minggu)
        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const startDate = new Date(start);
            const endDate = new Date(end);
            if (endDate < startDate) return 0;

            let count = 0;
            let curDate = new Date(startDate.getTime());
            while (curDate <= endDate) {
                const dayOfWeek = curDate.getDay();
                if (dayOfWeek !== 0) {
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        };
        
        // Helper untuk memformat Rupiah
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka || 0);
        };

        // Algoritma Terbilang Rupiah
        const terbilang = (angka) => {
            const a = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (angka < 12) return a[angka];
            if (angka < 20) return a[angka - 10] + " belas";
            if (angka < 100) return a[Math.floor(angka / 10)] + " puluh " + terbilang(angka % 10);
            if (angka < 200) return "seratus " + terbilang(angka - 100);
            if (angka < 1000) return a[Math.floor(angka / 100)] + " ratus " + terbilang(angka % 100);
            if (angka < 2000) return "seribu " + terbilang(angka - 1000);
            if (angka < 1000000) return terbilang(Math.floor(angka / 1000)) + " ribu " + terbilang(angka % 1000);
            if (angka < 1000000000) return terbilang(Math.floor(angka / 1000000)) + " juta " + terbilang(angka % 1000000);
            if (angka < 1000000000000) return terbilang(Math.floor(angka / 1000000000)) + " milyar " + terbilang(angka % 1000000000);
            if (angka < 1000000000000000) return terbilang(Math.floor(angka / 1000000000000)) + " triliun " + terbilang(angka % 1000000000000);
            return "";
        };

        const formatTerbilangRupiah = (angka) => {
            if (!angka || isNaN(angka)) return "";
            if (parseInt(angka) === 0) return "nol rupiah";
            let result = terbilang(parseInt(angka)).trim();
            result = result.replace(/\s+/g, ' '); // Hapus spasi ganda
            return result + " rupiah";
        };

        // Helper Format Tanggal Indonesia
        const formatDateIndo = (dateStr) => {
            if(!dateStr) return "";
            const date = new Date(dateStr);
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        };

        // Helper untuk mengubah angka waktu (hari) menjadi terbilang sederhana
        const terbilangAngka = (angka) => {
            const num = parseInt(angka);
            if(isNaN(num)) return "";
            const words = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            
            if (num < 12) {
                return words[num];
            } else if (num < 20) {
                return words[num - 10] + " belas";
            } else if (num < 100) {
                return words[Math.floor(num / 10)] + " puluh " + (words[num % 10] || "").trim();
            } else {
                return ""; // Dibatasi puluhan untuk kebutuhan durasi hari
            }
        };

            const max = BLOK_MAPPING[huruf] || 0;
            const options = [];
            for (let i = 1; i <= max; i++) {
                if (i === 4) options.push("3A");
                else if (i === 13) options.push("12A");
                else options.push(i.toString());
            }
            return options;
        };

                                                                                <label className="cursor-pointer print:hidden flex flex-col items-center justify-center w-24 h-12 border border-dashed border-blue-400 hover:border-blue-600 rounded bg-blue-50 hover:bg-blue-100 transition-colors">
                                                                                    <i data-lucide="upload" className="w-3.5 h-3.5 text-blue-500 mb-0.5"></i>
                                                                                    <span className="text-[8px] text-blue-600 font-bold text-center leading-tight">Upload TTD</span>
                                                                                    <input type="file" accept="image/*" className="hidden" onChange={handlePjSignatureUpload} />
                                                                                </label>
                                                                                <div className="hidden print:block text-[10px] text-slate-400 italic py-4">Tanda Tangan</div>
                                                                            </div>
                                                                        )}
                                                                        <div className="relative z-10 mt-auto">
                                                                            <span className="font-bold underline underline-offset-2 whitespace-nowrap block">{selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx].nama : "( ........................ )"}</span>
                                                                        </div>
                                                                    </div>

                                                                    {/* 2. Pemberi Tugas */}
                                                                    <div className="flex flex-col justify-between h-[130px] relative">
                                                                        <p className="font-bold mb-auto mt-0">Pemberi Tugas,</p>
                                                                        <div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div>
                                                                        <p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{pemberiTugas || "Farizal Zainur Rozikin"}</p>
                                                                    </div>
                                                                    
                                                                    {/* 3. Mengetahui */}
                                                                    <div className="flex flex-col justify-between h-[130px] relative">
                                                                        <p className="font-bold mb-auto mt-0">Mengetahui,</p>
                                                                        <div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div>
                                                                        <p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{keuanganName || "Sita Dita Cahyani"}</p>
                                                                    </div>

                                                                    {/* 4. Menyetujui */}
                                                                    <div className="flex flex-col justify-between h-[130px] relative">
                                                                        <p className="font-bold mb-auto mt-0">Menyetujui,</p>
                                                                        <div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div>
                                                                        <p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{kepalaKantorName || "Fika Faradila Cahyanti"}</p>
                                                                    </div>

                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
