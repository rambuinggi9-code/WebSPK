        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const startDate = new Date(start);
            const endDate = new Date(end);
            if (endDate < startDate) return 0;

            let count = 0;
            let curDate = new Date(startDate.getTime());
            while (curDate <= endDate) {
                if (curDate.getDay() !== 0) count++;
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        };

            const a = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (angka < 12) return a[angka];

                                                                <p>Selanjutnya disebut sebagai <strong>Pemborong/Pelaksana Pekerjaan</strong>, untuk melaksanakan pembangunan rumah di <strong>{t30LokasiPekerjaanDetail}</strong> sesuai dengan gambar kerja dan desain yang telah disetujui bersama, dengan ketentuan sebagai berikut:</p>

                                                                    <li className="pl-1 print-avoid-break">Apabila Pemborong tidak dapat menyelesaikan pekerjaan sampai dengan berakhirnya batas waktu pelaksanaan sebagaimana dimaksud pada angka 2, maka Pemborong dikenakan denda keterlambatan sebesar <strong>{formatRupiah(t30DendaKeterlambatan)} ({t30DendaKeterlambatanTerbilang || ".............................."}).</strong></li>
                                                                    <li className="pl-1 print-avoid-break">Dalam hal terjadi keterlambatan penyediaan material yang menjadi tanggung jawab Perusahaan, maka jangka waktu pelaksanaan pekerjaan akan diperpanjang sesuai dengan lamanya keterlambatan penyediaan material tersebut.</li>
                                                                    <li className="pl-1 print-avoid-break">Setelah Surat Perintah Kerja ini ditandatangani, tidak diperkenankan adanya penambahan bangunan atau perubahan pekerjaan, kecuali atas persetujuan tertulis dari Perusahaan.</li>
                                                                    <li className="pl-1 print-avoid-break">Pengambilan material di gudang hanya dapat dilakukan pada pukul <strong>{t30JamGudangPagiMulai || "07.30"}–{t30JamGudangPagiSelesai || "08.30"} WIB</strong> dan <strong>{t30JamGudangSiangMulai || "12.30"}–{t30JamGudangSiangSelesai || "13.30"} WIB.</strong></li>
                                                                    <li className="pl-1 print-avoid-break">Apabila Pemborong melakukan penambahan, perubahan, atau pekerjaan di luar desain dan spesifikasi yang telah disetujui tanpa sepengetahuan dan persetujuan Perusahaan, maka Perusahaan berhak memutuskan hubungan kerja atau kontrak secara sepihak tanpa kewajiban memberikan kompensasi kepada Pemborong.</li>

                                                                        )}
                                                                        <div className="relative z-10 mt-auto"><span className="font-bold underline underline-offset-2 whitespace-nowrap block">{selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx].nama : "( ........................ )"}</span></div>
                                                                    </div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Pemberi Tugas,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{pemberiTugas || "Farizal Zainur Rozikin"}</p></div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Mengetahui,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{keuanganName || "Sita Dita Cahyani"}</p></div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Menyetujui,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{kepalaKantorName || "Fika Faradila Cahyanti"}</p></div>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
