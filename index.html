    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Daftar Proyek & Lokasi
        const DAFTAR_PROYEK = [
            { nama: "Cinta Alam Residence - Ngenep, Karangploso", lokasi: "Ngenep, Karangploso, Malang", kode: "CAR" },
            { nama: "Green Blossom Residence - Kepuharjo, Karangploso", lokasi: "Kepuharjo, Karangploso, Malang", kode: "GBR" },
            { nama: "Griya Pesona Kejayan - Sumberbanteng, Kejayan", lokasi: "Sumberbanteng, Kejayan, Pasuruan", kode: "GPK" },
            { nama: "Harmoni Cluster - Mendalanwangi, Wagir", lokasi: "Mendalanwangi, Wagir, Malang", kode: "HC" },
            { nama: "Kantor Dawuhan - Tegalgondo, Karangploso", lokasi: "Tegalgondo, Karangploso, Malang", kode: "KD" },
            { nama: "Lembah Bunder Regency - Sidorahayu, Wagir", lokasi: "Sidorahayu, Wagir, Malang", kode: "LBR" },
            { nama: "Sekarputih - Junrejo, Batu", lokasi: "Junrejo, Batu", kode: "SP" },
            { nama: "Villa Royalle Orchid - Kepuharjo, Karangploso", lokasi: "Kepuharjo, Karangploso, Malang", kode: "VRO" }
        ];

        // Daftar Penanggungjawab & Jabatan
        const DAFTAR_PENANGGUNGJAWAB = [
            { nama: "Achmadi", jabatan: "Pengawas Lapangan All Proyek" },
            { nama: "Agus Sutanto", jabatan: "Pengawas Lapangan" },
            { nama: "Busro Khufidon", jabatan: "Logistik" },
            { nama: "Muhammad Taufiq", jabatan: "Pengawas Lapangan Bagian Fasum" },
            { nama: "Muhammad Yuda", jabatan: "Kepala Tukang Alumunium" },
            { nama: "Supardi", jabatan: "Quality Control Unit" },
            { nama: "Wahyu (Daok)", jabatan: "Pengawas Lapangan" }
        ];

        // Helper Angka Romawi untuk Bulan
        const getRomanMonth = (monthNumber) => {
            const roman = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
            return roman[monthNumber] || "I";
        };

        // Hitung Hari Kerja (Kecuali Hari Minggu)
        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const startDate = new Date(start);
            const endDate = new Date(end);
            if (endDate < startDate) return 0;

            let count = 0;
            let curDate = new Date(startDate.getTime());
            while (curDate <= endDate) {
                const dayOfWeek = curDate.getDay();
                if (dayOfWeek !== 0) {
                    count++;
                }
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        };
        
        // Helper untuk memformat Rupiah
        const formatRupiah = (angka) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka || 0);
        };

        // Algoritma Terbilang Rupiah
        const terbilang = (angka) => {
            const a = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (angka === 0) return "nol";
            if (angka < 12) return a[angka];
            if (angka < 20) return a[angka - 10] + " belas";
            if (angka < 100) return a[Math.floor(angka / 10)] + " puluh " + a[angka % 10];
            if (angka < 200) return "seratus " + terbilang(angka - 100);
            if (angka < 1000) return a[Math.floor(angka / 100)] + " ratus " + terbilang(angka % 100);
            if (angka < 2000) return "seribu " + terbilang(angka - 1000);
            if (angka < 1000000) return terbilang(Math.floor(angka / 1000)) + " ribu " + terbilang(angka % 1000);
            if (angka < 1000000000) return terbilang(Math.floor(angka / 1000000)) + " juta " + terbilang(angka % 1000000);
            if (angka < 1000000000000) return terbilang(Math.floor(angka / 1000000000)) + " milyar " + terbilang(angka % 1000000000);
            return "";
        };

        const formatTerbilangRupiah = (angka) => {
            if (!angka || isNaN(angka)) return "";
            let result = terbilang(parseInt(angka)).trim();
            result = result.replace(/\s+/g, ' '); // Hapus spasi ganda
            return result + " rupiah";
        };

        // Helper Format Tanggal Indonesia
        const formatDateIndo = (dateStr) => {
            if(!dateStr) return "";
            const date = new Date(dateStr);
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        };

        // Helper untuk mengubah angka waktu (hari) menjadi terbilang sederhana
        const terbilangAngka = (angka) => {
            const num = parseInt(angka);
            if(isNaN(num)) return "";
            const words = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            
            if (num < 12) {
                return words[num];
            } else if (num < 20) {
                return words[num - 10] + " belas";
            } else if (num < 100) {
                return words[Math.floor(num / 10)] + " puluh " + (words[num % 10] || "").trim();
            } else {
                return ""; // Dibatasi puluhan untuk kebutuhan durasi hari
            }
        };

        const DEFAULT_STATE = {
            selectedProyekIdx: "",
            pemberiTugas: "Farizal Zainur Rozikin", 
            selectedPjIdx: "",
            startDate: "", 
            endDate: "", 
            isManualSpk: false,
            ruangLingkup: [], 
            materials: [], 
            laborType: "harian",
            laborHarian: [
                { id: "1", tenaga: "Tukang", satuan: "Hari/Orang", volume: "", harga: "" },
                { id: "2", tenaga: "Kuli", satuan: "Hari/Orang", volume: "", harga: "" }
            ],
            laborBorongan: [], 
            keuanganName: "Sita Dita C",
            kepalaKantorName: "Fika Faradila C",
            pjSignatureImage: null
        };

        function App() {
            // Main Routing State
            const [activeView, setActiveView] = useState('home'); // 'home', 'spk_umum', 'spk_tipe30'

            // Theme State
            const [theme, setTheme] = useState(() => {
                return localStorage.getItem('BCA_THEME') || 'light';
            });

            // ==========================================
            // STATE UNTUK SPK GENERATOR (UMUM)
            // ==========================================
            const [daftarSpk, setDaftarSpk] = useState(() => {
                const saved = localStorage.getItem('BCA_DAFTAR_SPK');
                return saved ? JSON.parse(saved) : [];
            });
            const [activeSpkId, setActiveSpkId] = useState(null);

            const [selectedProyekIdx, setSelectedProyekIdx] = useState(DEFAULT_STATE.selectedProyekIdx);
            const [pemberiTugas, setPemberiTugas] = useState(DEFAULT_STATE.pemberiTugas);
            const [selectedPjIdx, setSelectedPjIdx] = useState(DEFAULT_STATE.selectedPjIdx);
            const [startDate, setStartDate] = useState(DEFAULT_STATE.startDate);
            const [endDate, setEndDate] = useState(DEFAULT_STATE.endDate);
            const [spkNumber, setSpkNumber] = useState("");
            const [isManualSpk, setIsManualSpk] = useState(DEFAULT_STATE.isManualSpk);

            const [instansiName, setInstansiName] = useState("PT. BANGUN CINTA ALAM");
            const [instansiAddress, setInstansiAddress] = useState("Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
            const [logoKiri, setLogoKiri] = useState(null);
            const [logoKanan, setLogoKanan] = useState(null);

            const [ruangLingkup, setRuangLingkup] = useState(DEFAULT_STATE.ruangLingkup);
            const [materials, setMaterials] = useState(DEFAULT_STATE.materials);
            const [laborType, setLaborType] = useState(DEFAULT_STATE.laborType);
            const [laborHarian, setLaborHarian] = useState(DEFAULT_STATE.laborHarian);
            const [laborBorongan, setLaborBorongan] = useState(DEFAULT_STATE.laborBorongan);

            const [keuanganName, setKeuanganName] = useState(DEFAULT_STATE.keuanganName);
            const [kepalaKantorName, setKepalaKantorName] = useState(DEFAULT_STATE.kepalaKantorName);
            const [pjSignatureImage, setPjSignatureImage] = useState(DEFAULT_STATE.pjSignatureImage); 

            // ==========================================
            // STATE KHUSUS UNTUK SPK BORONGAN (TIPE 30)
            // ==========================================
            const [t30DaftarSpk, setT30DaftarSpk] = useState(() => {
                const saved = localStorage.getItem('BCA_DAFTAR_SPK_TIPE30');
                return saved ? JSON.parse(saved) : [];
            });
            const [t30ActiveSpkId, setT30ActiveSpkId] = useState(null);

            const [t30HariPembuatan, setT30HariPembuatan] = useState("");
            const [t30TanggalPembuatan, setT30TanggalPembuatan] = useState("");
            const [t30NamaPemborong, setT30NamaPemborong] = useState("");
            const [t30HpPemborong, setT30HpPemborong] = useState("");
            const [t30AlamatPemborong, setT30AlamatPemborong] = useState("");
            const [t30LokasiPekerjaanDetail, setT30LokasiPekerjaanDetail] = useState("Proyek Lembah Bunder Regency Blok F-2 (Tipe 30)");
            const [t30NilaiBorongan, setT30NilaiBorongan] = useState("");
            const [t30NilaiBoronganTerbilang, setT30NilaiBoronganTerbilang] = useState("");
            const [t30WaktuPelaksanaan, setT30WaktuPelaksanaan] = useState("30");
            const [t30WaktuToleransi, setT30WaktuToleransi] = useState("10");
            const [t30TotalWaktuPelaksanaan, setT30TotalWaktuPelaksanaan] = useState("40");
            const [t30DendaKeterlambatan, setT30DendaKeterlambatan] = useState("");
            const [t30DendaKeterlambatanTerbilang, setT30DendaKeterlambatanTerbilang] = useState("");
            const [t30JamGudangPagiMulai, setT30JamGudangPagiMulai] = useState("07.30");
            const [t30JamGudangPagiSelesai, setT30JamGudangPagiSelesai] = useState("08.00");
            const [t30JamGudangSiangMulai, setT30JamGudangSiangMulai] = useState("12.30");
            const [t30JamGudangSiangSelesai, setT30JamGudangSiangSelesai] = useState("13.00");
            const [t30TempatDitetapkan, setT30TempatDitetapkan] = useState("Malang");
            const [t30TanggalDitetapkan, setT30TanggalDitetapkan] = useState("");

            // Kop Tipe 30
            const [t30InstansiName, setT30InstansiName] = useState("PT. BANGUN CINTA ALAM");
            const [t30InstansiAddress, setT30InstansiAddress] = useState("Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
            const [t30LogoKiri, setT30LogoKiri] = useState(null);
            const [t30LogoKanan, setT30LogoKanan] = useState(null);

            // State Notifikasi popup global
            const [notification, setNotification] = useState(null);

            const previewRef = useRef(null);

            // Efek perubahan Tema
            useEffect(() => {
                if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
                localStorage.setItem('BCA_THEME', theme);
            }, [theme]);

            // Sync ke LocalStorage untuk Umum
            useEffect(() => {
                localStorage.setItem('BCA_DAFTAR_SPK', JSON.stringify(daftarSpk));
            }, [daftarSpk]);

            // Sync ke LocalStorage untuk Tipe 30
            useEffect(() => {
                localStorage.setItem('BCA_DAFTAR_SPK_TIPE30', JSON.stringify(t30DaftarSpk));
            }, [t30DaftarSpk]);

            // Selalu trigger Lucide Icons rendering tiap ada perubahan view / render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            });

            // ==========================================
            // OTOMATISASI EFEK KHUSUS SPK TIPE 30
            // ==========================================

            // Ekstrak Hari berdasarkan Tanggal Pembuatan Tipe 30
            useEffect(() => {
                if (t30TanggalPembuatan) {
                    const date = new Date(t30TanggalPembuatan);
                    if (!isNaN(date.getTime())) {
                        const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];

                    }
                } else {
                    setT30HariPembuatan("");
                }
            }, [t30TanggalPembuatan]);

            // Kalkulasi Denda (10%) & Terbilang Rupiah secara Otomatis untuk Tipe 30
            useEffect(() => {
                if (t30NilaiBorongan && !isNaN(t30NilaiBorongan)) {
                    const val = parseInt(t30NilaiBorongan);
                    setT30NilaiBoronganTerbilang(formatTerbilangRupiah(val));
                    
                    const denda = val * 0.1;
                    setT30DendaKeterlambatan(denda.toString());
                    setT30DendaKeterlambatanTerbilang(formatTerbilangRupiah(denda));
                } else {
                    setT30NilaiBoronganTerbilang("");
                    setT30DendaKeterlambatan("");
                    setT30DendaKeterlambatanTerbilang("");
                }
            }, [t30NilaiBorongan]);


            // Generate Nomor SPK secara otomatis (Hanya untuk UMUM)
            useEffect(() => {
                if (!isManualSpk) {
                    if (startDate && selectedProyekIdx !== "") {
                        const dateObj = new Date(startDate);
                        const monthRoman = getRomanMonth(dateObj.getMonth());
                        const year = dateObj.getFullYear();
                        const proyek = DAFTAR_PROYEK[selectedProyekIdx];
                        const projectCode = proyek ? proyek.kode : "PROYEK";
                        
                        const generated = `042/BCA-SPK/${monthRoman}/${projectCode}-${year}`;
                        setSpkNumber(generated);
                    } else {
                        setSpkNumber(""); 
                    }
                }
            }, [selectedProyekIdx, startDate, isManualSpk]);

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            const showNotification = (message, type = 'success') => {
                setNotification({ message, type });
                setTimeout(() => {
                    setNotification(null);
                }, 4000);
            };

            const handlePreviewScroll = () => {
                if (previewRef.current) {
                    previewRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    showNotification("Menampilkan Pratinjau Dokumen SPK.", "info");
                }
            };

            // ==========================================
            // HANDLER UNTUK SPK GENERATOR (UMUM)
            // ==========================================
            const handleResetData = () => {
                setSelectedProyekIdx(DEFAULT_STATE.selectedProyekIdx);
                setPemberiTugas(DEFAULT_STATE.pemberiTugas);
                setSelectedPjIdx(DEFAULT_STATE.selectedPjIdx);
                setStartDate(DEFAULT_STATE.startDate);
                setEndDate(DEFAULT_STATE.endDate);
                setIsManualSpk(DEFAULT_STATE.isManualSpk);
                setSpkNumber("");
                setRuangLingkup(JSON.parse(JSON.stringify(DEFAULT_STATE.ruangLingkup)));
                setMaterials(JSON.parse(JSON.stringify(DEFAULT_STATE.materials)));
                setLaborType(DEFAULT_STATE.laborType);
                setLaborHarian(JSON.parse(JSON.stringify(DEFAULT_STATE.laborHarian)));
                setLaborBorongan(JSON.parse(JSON.stringify(DEFAULT_STATE.laborBorongan)));
                setKeuanganName(DEFAULT_STATE.keuanganName);
                setKepalaKantorName(DEFAULT_STATE.kepalaKantorName);
                setPjSignatureImage(DEFAULT_STATE.pjSignatureImage); 
                
                setInstansiName("PT. BANGUN CINTA ALAM");
                setInstansiAddress("Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
                
                setActiveSpkId(null);
                showNotification("Semua formulir input berhasil dikosongkan!", "info");
            };

            const handlePrint = () => {
                const originalTitle = document.title;
                const safeSpkNumber = spkNumber ? spkNumber.replace(/\//g, '_') : 'Draf_Baru';
                
                document.title = `SPK_${safeSpkNumber}`;
                window.print();
                
                setTimeout(() => {
                    document.title = originalTitle;
                }, 2000);
            };

            const handleSaveSpk = () => {
                if(selectedProyekIdx === "") {
                    showNotification("Harap pilih nama proyek terlebih dahulu!", "error");
                    return;
                }

                const dataSpk = {
                    id: activeSpkId || Date.now().toString(),
                    spkNumber,
                    proyekIdx: selectedProyekIdx,
                    proyekNama: DAFTAR_PROYEK[selectedProyekIdx]?.nama,
                    pemberiTugas,
                    pjIdx: selectedPjIdx,
                    startDate,
                    endDate,
                    ruangLingkup,
                    materials,
                    laborType,
                    laborHarian,
                    laborBorongan,
                    keuanganName,
                    kepalaKantorName,
                    pjSignatureImage, 
                    instansiName,
                    instansiAddress,
                    lastUpdated: new Date().toLocaleString('id-ID')
                };

                if (activeSpkId) {
                    setDaftarSpk(daftarSpk.map(item => item.id === activeSpkId ? dataSpk : item));
                    showNotification("Draf SPK berhasil diperbarui!");
                } else {
                    setDaftarSpk([...daftarSpk, dataSpk]);
                    setActiveSpkId(dataSpk.id);
                    showNotification("SPK baru berhasil disimpan!");
                }
            };

            const handleLoadSpk = (id) => {
                const target = daftarSpk.find(item => item.id === id);
                if (target) {
                    setActiveSpkId(target.id);
                    setSpkNumber(target.spkNumber || "");
                    setSelectedProyekIdx(target.proyekIdx !== undefined ? target.proyekIdx : "");
                    setPemberiTugas(target.pemberiTugas || "");
                    setSelectedPjIdx(target.pjIdx !== undefined ? target.pjIdx : "");
                    setStartDate(target.startDate || "");
                    setEndDate(target.endDate || "");
                    setRuangLingkup(target.ruangLingkup || []);
                    setMaterials(target.materials || []);
                    setLaborType(target.laborType || "harian");
                    setLaborHarian(target.laborHarian || []);
                    setLaborBorongan(target.laborBorongan || []);
                    setKeuanganName(target.keuanganName || "");
                    setKepalaKantorName(target.kepalaKantorName || "");
                    setPjSignatureImage(target.pjSignatureImage || null); 
                    
                    setInstansiName(target.instansiName || "PT. BANGUN CINTA ALAM");
                    setInstansiAddress(target.instansiAddress || "Jl. Langsep No. 78 Perum.Puri Firdaus Blok J1 Pendem - Kota Batu\nTelp. 0856-9529-7970 | Email: pt.banguncintaalam@gmail.com");
                    
                    setIsManualSpk(true);

                    window.scrollTo({ top: 0, behavior: 'smooth' });
                    showNotification(`Memuat dokumen SPK: ${target.spkNumber}`);
                }
            };

            const handleDeleteSpk = (id, e) => {
                e.stopPropagation();
                setDaftarSpk(daftarSpk.filter(item => item.id !== id));
                if (activeSpkId === id) {
                    setActiveSpkId(null);
                }
                showNotification("Dokumen SPK berhasil dihapus.", "error");
            };

            const handleLogoUpload = (e, target) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();

                                                            <div className="w-20 h-20 flex items-center justify-center overflow-hidden shrink-0">
                                                                {logoKanan ? (
                                                                    <img src={logoKanan} alt="Logo Kanan" className="max-h-full max-w-full object-contain" />
                                                                ) : (
                                                                    <div className="w-16 h-16 border-2 border-slate-300 rounded-full flex items-center justify-center p-1 bg-slate-50">
                                                                        <span className="text-[10px] font-black tracking-tighter text-slate-400 leading-none text-center">LOGOKANAN</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                    {/* Garis Ganda Kop Surat */}
                                                    <div className="w-full border-b border-slate-900 mb-[2px]"></div>
                                                    <div className="w-full border-b-[3px] border-slate-900 mb-6"></div>
                                                </td>
                                            </tr>
                                        </thead>

                                        {/* ISI UTAMA DOKUMEN SPK */}
                                        <tbody className="table-row-group">
                                            <tr>
                                                <td>
                                                    <div className="space-y-6 pt-2">
                                                        
                                                        {/* Judul tanpa Underline Sesuai Request */}
                                                        <div className="text-center space-y-1.5 mb-8">
                                                            <h1 className="text-base font-black tracking-widest uppercase text-slate-950 inline-block mb-1">
                                                                Surat Perintah Kerja
                                                            </h1>
                                                            <p className="text-xs font-mono font-bold text-slate-700 block">
                                                                {spkNumber ? `Nomor: ${spkNumber}` : "Nomor: [Belum Tergenerate]"}
                                                            </p>
                                                        </div>

                                                        {/* SECTION A: DATA PROYEK */}
                                                        <div className="space-y-2.5 print-avoid-break">
                                                            <h4 className="text-xs font-bold text-slate-900 border-b-2 border-slate-800 pb-1 uppercase tracking-wide">A. Informasi Pekerjaan</h4>
                                                            
                                                            <div className="grid grid-cols-1 gap-y-2 text-xs text-slate-800 pl-2">
                                                                <div className="flex">
                                                                    <span className="w-40 font-semibold">1. Nama Proyek</span>
                                                                    <span className="w-4 text-center">:</span>
                                                                    <span className="flex-1 font-bold">{selectedProyekIdx !== "" ? DAFTAR_PROYEK[selectedProyekIdx]?.nama : "-"}</span>
                                                                </div>
                                                                
                                                                <div className="flex">
                                                                    <span className="w-40 font-semibold">2. Lokasi Proyek</span>
                                                                    <span className="w-4 text-center">:</span>
                                                                    <span className="flex-1">{selectedProyekIdx !== "" ? DAFTAR_PROYEK[selectedProyekIdx]?.lokasi : "-"}</span>
                                                                </div>

                                                                <div className="flex">
                                                                    <span className="w-40 font-semibold">3. Pemberi Tugas</span>
                                                                    <span className="w-4 text-center">:</span>
                                                                    <span className="flex-1 font-bold uppercase">{pemberiTugas || "-"}</span>
                                                                </div>

                                                                <div className="flex">
                                                                    <span className="w-40 font-semibold">4. Penanggung Jawab</span>
                                                                    <span className="w-4 text-center">:</span>
                                                                    <span className="flex-1 font-bold">{selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.nama : "-"} <span className="font-normal italic">({selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.jabatan : "-"})</span></span>
                                                                </div>

                                                                <div className="flex">
                                                                    <span className="w-40 font-semibold">5. Waktu Pelaksanaan</span>
                                                                    <span className="w-4 text-center">:</span>
                                                                    <span className="flex-1 font-semibold">
                                                                        {startDate ? new Date(startDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : "-"} <span className="font-normal mx-1">s/d</span> {endDate ? new Date(endDate).toLocaleDateString('id-ID', {day: 'numeric', month: 'long', year: 'numeric'}) : "-"}
                                                                    </span>
                                                                </div>

                                                                {endDate && startDate && (
                                                                    <div className="flex mt-1">
                                                                        <span className="w-40 font-semibold"></span>
                                                                        <span className="w-4 text-center"></span>
                                                                        <span className="flex-1 text-[11px] font-bold text-slate-900 italic bg-slate-100 px-2 py-1 rounded inline-block w-fit">Durasi: {durasiHari} Hari Aktif Kerja</span>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        {/* SECTION B: RUANG LINGKUP PEKERJAAN (Mencegah pecah di tengah halaman) */}
                                                        <div className="space-y-2.5 print-avoid-break">
                                                            <h4 className="text-xs font-bold text-slate-900 border-b-2 border-slate-800 pb-1 uppercase tracking-wide">B. Ruang Lingkup Pekerjaan</h4>
                                                            
                                                            {ruangLingkup.length === 0 ? (
                                                                <div className="p-4 border border-dashed border-slate-300 rounded text-[11px] text-slate-500 italic text-center">
                                                                    [ Data ruang lingkup belum diisi ]
                                                                </div>
                                                            ) : (
                                                                <div className="overflow-hidden border border-slate-950">
                                                                    <table className="w-full text-left text-[11px] border-collapse">
                                                                        <thead>
                                                                            <tr className="bg-slate-100 border-b border-slate-950 text-slate-955 font-bold">
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-12 text-center">No.</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955">Uraian Jenis Pekerjaan</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-24 text-center">Volume</th>
                                                                                <th className="py-2 px-3 w-24 text-center">Satuan</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {ruangLingkup.map((item, parentIdx) => (
                                                                                <React.Fragment key={item.id}>
                                                                                    <tr className="border-b border-slate-950 font-bold bg-slate-50">
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-center font-mono">{parentIdx + 1}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-slate-955 uppercase">{item.uraian || `Pekerjaan Utama ${parentIdx+1}`}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-center">{item.volume || "-"}</td>
                                                                                        <td className="py-1.5 px-3 text-center">{item.satuan || "-"}</td>
                                                                                    </tr>
                                                                                    
                                                                                    {item.subs && item.subs.map((sub, subIdx) => (
                                                                                        <tr key={sub.id} className="border-b border-slate-300 text-slate-800 bg-white">
                                                                                            <td className="py-1.5 px-3 border-r border-slate-955 text-right text-[10px] font-mono pr-4">{parentIdx + 1}.{subIdx + 1}</td>
                                                                                            <td className="py-1.5 px-6 border-r border-slate-955">- {sub.uraian || `Sub Pekerjaan ${subIdx+1}`}</td>
                                                                                            <td className="py-1.5 px-3 border-r border-slate-955 text-center font-medium">{sub.volume || "-"}</td>
                                                                                            <td className="py-1.5 px-3 text-center font-medium">{sub.satuan || "-"}</td>
                                                                                        </tr>
                                                                                    ))}
                                                                                </React.Fragment>
                                                                            ))}
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {/* SECTION C: BIAYA MATERIAL (Mencegah pecah di tengah halaman) */}
                                                        <div className="space-y-2.5 print-avoid-break">
                                                            <h4 className="text-xs font-bold text-slate-900 border-b-2 border-slate-800 pb-1 uppercase tracking-wide">C. Anggaran Biaya Material</h4>
                                                            
                                                            {materials.length === 0 ? (
                                                                <div className="p-4 border border-dashed border-slate-300 rounded text-[11px] text-slate-500 italic text-center">
                                                                    [ Data material belum diisi ]
                                                                </div>
                                                            ) : (
                                                                <div className="overflow-hidden border border-slate-950">
                                                                    <table className="w-full text-left text-[11px] border-collapse bg-white">
                                                                        <thead>
                                                                            <tr className="bg-slate-100 border-b border-slate-950 text-slate-955 font-bold">
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-12 text-center">No.</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955">Nama/Jenis Material</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-16 text-center">Qty</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-16 text-center">Sat</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-28 text-right">Harga Sat (Rp)</th>
                                                                                <th className="py-2 px-3 w-28 text-right">Jumlah (Rp)</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {materials.map((mat, idx) => (
                                                                                <tr key={mat.id} className="border-b border-slate-300 text-slate-900">
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center font-mono">{idx + 1}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 font-medium">{mat.nama || `Material #${idx+1}`}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center">{mat.qty || "-"}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center">{mat.satuan || "-"}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-right font-mono">{(Number(mat.harga)||0).toLocaleString('id-ID')}</td>
                                                                                    <td className="py-1.5 px-3 text-right font-mono font-bold">{((Number(mat.qty)||0) * (Number(mat.harga)||0)).toLocaleString('id-ID')}</td>
                                                                                </tr>
                                                                            ))}
                                                                            <tr className="bg-slate-200 font-bold border-t-2 border-slate-950 text-slate-950">
                                                                                <td colSpan="5" className="py-2 px-3 text-right border-r border-slate-955 uppercase text-[10px]">Sub-Total Biaya Material:</td>
                                                                                <td className="py-2 px-3 text-right font-mono text-xs">{(totalMaterial).toLocaleString('id-ID')}</td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                </div>
                                                            )}
                                                        </div>

                                                        {/* SECTION D: BIAYA TENAGA KERJA (Mencegah pecah di tengah halaman) */}
                                                        <div className="space-y-2.5 print-avoid-break">
                                                            <h4 className="text-xs font-bold text-slate-900 border-b-2 border-slate-800 pb-1 uppercase tracking-wide">
                                                                D. Anggaran Biaya Tenaga Kerja <span className="font-normal italic capitalize">({laborType})</span>
                                                            </h4>
                                                            
                                                            <div className="overflow-hidden border border-slate-950">
                                                                {laborType === 'harian' ? (
                                                                    <table className="w-full text-left text-[11px] border-collapse bg-white">
                                                                        <thead>
                                                                            <tr className="bg-slate-100 border-b border-slate-950 text-slate-955 font-bold">
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-12 text-center">No.</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955">Golongan Tenaga Kerja</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-24 text-center">Satuan</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-24 text-center">Vol (Hari)</th>
                                                                                <th className="py-2 px-3 border-r border-slate-955 w-28 text-right">Harga Sat (Rp)</th>
                                                                                <th className="py-2 px-3 w-28 text-right">Jumlah (Rp)</th>
                                                                            </tr>
                                                                        </thead>
                                                                        <tbody>
                                                                            {laborHarian.map((lab, idx) => (
                                                                                <tr key={lab.id} className="border-b border-slate-300 text-slate-900">
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center font-mono">{idx + 1}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 font-medium">{lab.tenaga || `Tenaga #${idx+1}`}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center">{lab.satuan}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-center">{lab.volume || "-"}</td>
                                                                                    <td className="py-1.5 px-3 border-r border-slate-955 text-right font-mono">{(Number(lab.harga)||0).toLocaleString('id-ID')}</td>
                                                                                    <td className="py-1.5 px-3 text-right font-mono font-bold">{((Number(lab.volume)||0) * (Number(lab.harga)||0)).toLocaleString('id-ID')}</td>
                                                                                </tr>
                                                                            ))}
                                                                            <tr className="bg-slate-200 font-bold border-t-2 border-slate-950 text-slate-950">
                                                                                <td colSpan="5" className="py-2 px-3 text-right border-r border-slate-955 uppercase text-[10px]">Sub-Total Biaya Tenaga Kerja:</td>
                                                                                <td className="py-2 px-3 text-right font-mono text-xs">{(totalLabor).toLocaleString('id-ID')}</td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                ) : (
                                                                    laborBorongan.length === 0 ? (
                                                                        <div className="p-4 text-[11px] text-slate-500 italic text-center bg-slate-50">
                                                                            [ Data tenaga borongan belum diisi ]
                                                                        </div>
                                                                    ) : (
                                                                        <table className="w-full text-left text-[11px] border-collapse bg-white">
                                                                            <thead>
                                                                                <tr className="bg-slate-100 border-b border-slate-950 text-slate-955 font-bold">
                                                                                    <th className="py-2 px-3 border-r border-slate-955 w-12 text-center">No.</th>
                                                                                    <th className="py-2 px-3 border-r border-slate-955">Uraian Borongan</th>
                                                                                    <th className="py-2 px-3 border-r border-slate-955 w-20 text-center">Vol</th>
                                                                                    <th className="py-2 px-3 border-r border-slate-955 w-20 text-center">Sat</th>
                                                                                    <th className="py-2 px-3 border-r border-slate-955 w-28 text-right">Harga Sat (Rp)</th>
                                                                                    <th className="py-2 px-3 w-28 text-right">Jumlah (Rp)</th>
                                                                                </tr>
                                                                            </thead>
                                                                            <tbody>
                                                                                {laborBorongan.map((lab, idx) => (
                                                                                    <tr key={lab.id} className="border-b border-slate-300 text-slate-900">
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-center font-mono">{idx + 1}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 font-medium">{lab.uraian || `Borongan #${idx+1}`}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-center">{lab.volume || "-"}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-center">{lab.satuan || "-"}</td>
                                                                                        <td className="py-1.5 px-3 border-r border-slate-955 text-right font-mono">{(Number(lab.harga)||0).toLocaleString('id-ID')}</td>
                                                                                        <td className="py-1.5 px-3 text-right font-mono font-bold">{((Number(lab.volume)||0) * (Number(lab.harga)||0)).toLocaleString('id-ID')}</td>
                                                                                    </tr>
                                                                                ))}
                                                                                <tr className="bg-slate-200 font-bold border-t-2 border-slate-950 text-slate-950">
                                                                                    <td colSpan="5" className="py-2 px-3 text-right border-r border-slate-955 uppercase text-[10px]">Sub-Total Biaya Tenaga Kerja:</td>
                                                                                    <td className="py-2 px-3 text-right font-mono text-xs">{(totalLabor).toLocaleString('id-ID')}</td>
                                                                                </tr>
                                                                            </tbody>
                                                                        </table>
                                                                    )
                                                                )}
                                                            </div>
                                                        </div>

                                                        {/* GRAND TOTAL */}
                                                        <div className="bg-slate-100 p-4 border-2 border-slate-950 mt-4 flex flex-row items-center justify-between print-avoid-break">
                                                            <div className="uppercase">
                                                                <h3 className="text-sm font-black text-slate-950 tracking-wider">Total Anggaran SPK</h3>
                                                                <p className="text-[10px] text-slate-700 font-bold mt-0.5">(Material + Tenaga Kerja)</p>
                                                            </div>
                                                            <div className="text-right">
                                                                <span className="text-lg font-black font-mono tracking-tight text-slate-955">
                                                                    Rp {grandTotal.toLocaleString('id-ID')}
                                                                </span>
                                                            </div>
                                                        </div>

                                                        {/* SECTION E: PENGESAHAN & PENANDATANGANAN */}
                                                        <div className="space-y-2.5 print-avoid-break mt-6">
                                                            <h4 className="text-xs font-bold text-slate-900 border-b-2 border-slate-800 pb-1 uppercase tracking-wide">
                                                                E. Pengesahan & Penandatanganan
                                                            </h4>
                                                            
                                                            <div className="pt-4 pb-6">
                                                                <div className="grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 print-cols-4 gap-4 text-[11px] text-center">
                                                                    
                                                                    {/* 1. Pemberi Tugas */}
                                                                    <div className="flex flex-col justify-between h-[140px] p-2 relative">
                                                                        <span className="font-bold text-slate-900 uppercase tracking-tight">Pemberi Tugas</span>
                                                                        <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan & Stempel</div>
                                                                        <div>
                                                                            <span className="font-black underline underline-offset-2 text-slate-950 block">{pemberiTugas}</span>
                                                                        </div>
                                                                    </div>

                                                                    {/* 2. Keuangan */}
                                                                    <div className="flex flex-col justify-between h-[140px] p-2 relative">
                                                                        <span className="font-bold text-slate-900 uppercase tracking-tight">Mengetahui</span>
                                                                        <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan</div>
                                                                        <div>
                                                                            <span className="font-black underline underline-offset-2 text-slate-950 block">{keuanganName}</span>
                                                                        </div>
                                                                    </div>

                                                                    {/* 3. Penanggung Jawab (Dengan Upload TTD in-place) */}
                                                                    <div className="flex flex-col justify-between h-[140px] p-2 relative group">
                                                                        <span className="font-bold text-slate-900 uppercase tracking-tight">Penerima Tugas</span>
                                                                        
                                                                        {pjSignatureImage ? (
                                                                            <div className="my-auto flex items-center justify-center h-20 w-full overflow-hidden absolute inset-0 top-1/2 -translate-y-1/2 z-0">
                                                                                <img 
                                                                                    src={pjSignatureImage} 
                                                                                    alt="Tanda Tangan" 
                                                                                    className="signature-img max-h-full object-contain mix-blend-multiply opacity-90" 
                                                                                />
                                                                                {/* Overlay Ubah TTD (Sembunyi saat Print) */}
                                                                                <label className="absolute inset-0 bg-white/80 flex flex-col items-center justify-center cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity print:hidden rounded">
                                                                                    <i data-lucide="upload-cloud" className="w-4 h-4 text-blue-600 mb-1"></i>
                                                                                    <span className="text-[9px] font-bold text-blue-700">Ubah TTD</span>
                                                                                    <input type="file" accept="image/*" className="hidden" onChange={handlePjSignatureUpload} />
                                                                                </label>
                                                                            </div>
                                                                        ) : (
                                                                            <div className="my-auto relative z-10 w-full flex justify-center">
                                                                                {/* Tombol Upload (Sembunyi saat Print) */}
                                                                                <label className="cursor-pointer print:hidden flex flex-col items-center justify-center w-24 h-12 border border-dashed border-blue-400 hover:border-blue-600 dark:border-indigo-500 rounded bg-blue-50 dark:bg-indigo-900/30 hover:bg-blue-100 dark:hover:bg-indigo-800/40 transition-colors">
                                                                                    <i data-lucide="upload" className="w-3.5 h-3.5 text-blue-500 dark:text-indigo-400 mb-0.5"></i>
                                                                                    <span className="text-[8px] text-blue-600 dark:text-indigo-300 font-bold text-center leading-tight">Upload TTD Digital</span>
                                                                                    <input type="file" accept="image/*" className="hidden" onChange={handlePjSignatureUpload} />
                                                                                </label>
                                                                                {/* Teks Dummy Tanda Tangan (Hanya Tampil di Print jika TTD kosong) */}
                                                                                <div className="hidden print:block text-[10px] text-slate-400 italic">Tanda Tangan</div>
                                                                            </div>
                                                                        )}
                                                                        
                                                                        <div className="relative z-10">
                                                                            <span className="font-black underline underline-offset-2 text-slate-950 block">{selectedPjIdx !== "" ? DAFTAR_PENANGGUNGJAWAB[selectedPjIdx]?.nama : "-"}</span>
                                                                        </div>
                                                                    </div>

                                                                    {/* 4. Kepala Kantor */}
                                                                    <div className="flex flex-col justify-between h-[140px] p-2 relative">
                                                                        <span className="font-bold text-slate-900 uppercase tracking-tight">Menyetujui</span>
                                                                        <div className="my-auto text-[10px] text-slate-400 italic print:text-transparent">Tanda Tangan</div>
                                                                        <div>
                                                                            <span className="font-black underline underline-offset-2 text-slate-950 block">{kepalaKantorName}</span>
                                                                        </div>
                                                                    </div>

                                                                </div>
                                                            </div>
                                                        </div>

                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>

                                </div>
                            </div>
                        </main>
                    </div>

                    <footer className="text-center text-xs text-slate-500 dark:text-slate-400 mt-16 print:hidden font-medium">
                        <p>© 2026 PT Bangun Cinta Alam. All Rights Reserved.</p>
                    </footer>
                </div>
            );
        }

        // Inisialisasi React & Rendering
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
