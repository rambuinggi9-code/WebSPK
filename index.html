<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Sistem Manajemen Proyek - PT Bangun Cinta Alam</title>
    
    <!-- Google Fonts: Montserrat & Carlito (Metric-Compatible Calibri) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <!-- React, ReactDOM, Babel, Tailwind & Lucide -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js" crossorigin></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Montserrat"', 'sans-serif'],
                        serif: ['"Montserrat"', 'Georgia', 'serif'],
                        mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
                    }
                }
            }
        };
    </script>
    <style>
        /* =========================================================
           ATURAN CETAK (PRINT A4 - PRESISI & BERSIH)
           ========================================================= */
        @page {
            size: A4;
            margin: 12mm;
        }

        @media print {
            body {
                background: #ffffff !important;
                color: #000000 !important;
                padding: 0 !important;
                margin: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .print\:hidden {
                display: none !important;
            }
            .app-page-shell {
                padding-top: 0 !important;
            }
            .paper-preview {
                width: 100% !important;
                max-width: 100% !important;
                min-height: auto !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                background: #ffffff !important;
                color: #000000 !important;
            }
            .paper-preview::before,
            .paper-preview::after {
                display: none !important;
            }
            .print-avoid-break {
                break-inside: avoid;
                page-break-inside: avoid;
            }
            .print-cols-2 {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
            }
            .print-cols-3 {
                display: grid !important;
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            }
            .print-cols-4 {
                display: grid !important;
                grid-template-columns: repeat(4, minmax(0, 1fr)) !important;
            }
            .signature-img {
                mix-blend-mode: multiply;
            }
        }

        /* =========================================================
           SISTEM ANIMASI FUTURISTIK, CYBER-HUD & GLASSMORPHISM
           ========================================================= */
        @keyframes hudBootEnter {
            0% {
                opacity: 0;
                filter: blur(6px);
                transform: translateY(16px) scale(0.985);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: none;
            }
        }

        @keyframes cardCascade {
            0% {
                opacity: 0;
                transform: translateY(24px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes toastSpringIn {
            0% {
                opacity: 0;
                transform: translateX(40px) scale(0.9);
            }
            70% {
                opacity: 1;
                transform: translateX(-5px) scale(1.02);
            }
            100% {
                opacity: 1;
                transform: translateX(0) scale(1);
            }
        }

        @keyframes modalPopIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(16px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes floatOrbA {
            0%, 100% {
                transform: translate(0px, 0px) scale(1);
            }
            33% {
                transform: translate(26px, -28px) scale(1.08);
            }
            66% {
                transform: translate(-18px, 16px) scale(0.94);
            }
        }

        @keyframes floatOrbB {
            0%, 100% {
                transform: translate(0px, 0px) scale(1);
            }
            50% {
                transform: translate(-30px, -22px) scale(1.1);
            }
        }

        @keyframes gridDrift {
            0% {
                background-position: 0px 0px, 0px 0px, 0px 0px, 0px 0px, 0px 0px;
            }
            100% {
                background-position: 0px 0px, 0px 0px, 0px 0px, 36px 36px, 36px 36px;
            }
        }

        @keyframes orbitSlow {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes orbitReverse {
            from {
                transform: rotate(360deg);
            }
            to {
                transform: rotate(0deg);
            }
        }

        @keyframes gradientFlow {
            0% {
                background-position: 0% 50%;
            }
            50% {
                background-position: 100% 50%;
            }
            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes livePulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.75);
            }
            50% {
                opacity: 0.75;
                transform: scale(1.3);
                box-shadow: 0 0 0 7px rgba(16, 185, 129, 0);
            }
        }

        @keyframes eqBar {
            0%, 100% { height: 4px; }
            50% { height: 13px; }
        }

        .animate-view-enter {
            animation: hudBootEnter 0.48s cubic-bezier(0.16, 1, 0.3, 1) backwards;
        }

        .animate-toast {
            animation: toastSpringIn 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-modal {
            animation: modalPopIn 0.32s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        .animate-orb-a {
            animation: floatOrbA 13s ease-in-out infinite;
        }

        .animate-orb-b {
            animation: floatOrbB 16s ease-in-out infinite;
        }

        .animate-orbit-slow {
            animation: orbitSlow 14s linear infinite;
        }

        .animate-orbit-reverse {
            animation: orbitReverse 10s linear infinite;
        }

        .animate-gradient-flow {
            background-size: 200% 200%;
            animation: gradientFlow 5s ease infinite;
        }

        .animate-live-dot {
            animation: livePulse 2s ease-in-out infinite;
        }

        .animate-stagger-1 { animation: cardCascade 0.48s cubic-bezier(0.16, 1, 0.3, 1) 0.04s both; }
        .animate-stagger-2 { animation: cardCascade 0.48s cubic-bezier(0.16, 1, 0.3, 1) 0.10s both; }
        .animate-stagger-3 { animation: cardCascade 0.48s cubic-bezier(0.16, 1, 0.3, 1) 0.16s both; }
        .animate-stagger-4 { animation: cardCascade 0.48s cubic-bezier(0.16, 1, 0.3, 1) 0.22s both; }
        .animate-stagger-5 { animation: cardCascade 0.48s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both; }

        /* Tombol Futuristik dengan Light Beam Sweep */
        .btn-shimmer {
            position: relative;
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.28s ease, border-color 0.25s ease, background-color 0.25s ease;
        }
        .btn-shimmer::after {
            content: '';
            position: absolute;
            top: 0;
            left: -130%;
            width: 75%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.38), transparent);
            transform: skewX(-24deg);
            transition: left 0.65s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .btn-shimmer:hover::after {
            left: 160%;
        }
        .btn-shimmer:hover {
            transform: translateY(-1.5px);
        }
        .btn-shimmer:active {
            transform: scale(0.97);
        }

        /* Cyber-Glass Card & HUD Accents */
        .glass-card {
            position: relative;
            background: rgba(255, 255, 255, 0.84);
            backdrop-filter: blur(20px) saturate(175%);
            -webkit-backdrop-filter: blur(20px) saturate(175%);
            box-shadow: 0 12px 34px -14px rgba(14, 116, 144, 0.12), inset 0 1px 0 0 rgba(255, 255, 255, 0.95);
            transition: box-shadow 0.32s ease, border-color 0.32s ease, transform 0.32s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dark .glass-card {
            background: rgba(11, 17, 34, 0.80);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 16px 40px -14px rgba(0, 0, 0, 0.65), inset 0 1px 0 0 rgba(56, 189, 248, 0.14);
        }

        /* Sudut Targeting HUD Futuristik (Lengkung Konsentris & Presisi) */
        .hud-frame {
            --hud-offset: 8px;
            --hud-radius: 1rem;
            --hud-size: 18px;
            --hud-size-hover: 24px;
            position: relative;
        }
        .hud-frame.rounded-3xl {
            --hud-offset: 10px;
            --hud-radius: 1.5rem;
            --hud-size: 22px;
            --hud-size-hover: 28px;
        }
        .hud-frame.rounded-\[2rem\] {
            --hud-offset: 11px;
            --hud-radius: 2rem;
            --hud-size: 28px;
            --hud-size-hover: 34px;
        }
        .hud-frame::before,
        .hud-frame::after {
            content: '';
            position: absolute;
            width: var(--hud-size);
            height: var(--hud-size);
            pointer-events: none;
            transition: width 0.32s cubic-bezier(0.16, 1, 0.3, 1), height 0.32s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease, opacity 0.3s ease;
            z-index: 20;
            opacity: 0.72;
        }
        .hud-frame::before {
            top: var(--hud-offset);
            left: var(--hud-offset);
            border-top: 2px solid rgba(14, 165, 233, 0.55);
            border-left: 2px solid rgba(14, 165, 233, 0.55);
            border-top-left-radius: max(0px, calc(var(--hud-radius) - var(--hud-offset)));
        }
        .hud-frame::after {
            bottom: var(--hud-offset);
            right: var(--hud-offset);
            border-bottom: 2px solid rgba(99, 102, 241, 0.55);
            border-right: 2px solid rgba(99, 102, 241, 0.55);
            border-bottom-right-radius: max(0px, calc(var(--hud-radius) - var(--hud-offset)));
        }
        .hud-frame:hover::before,
        .hud-frame:hover::after {
            width: var(--hud-size-hover);
            height: var(--hud-size-hover);
            border-color: rgba(6, 182, 212, 0.95);
            opacity: 1;
        }

        /* Latar Belakang Cyber-Architectural Grid */
        .architecture-bg {
            background-color: #eef4fb;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(6, 182, 212, 0.13), transparent 38%),
                radial-gradient(circle at 88% 15%, rgba(59, 130, 246, 0.12), transparent 40%),
                radial-gradient(circle at 78% 88%, rgba(99, 102, 241, 0.11), transparent 42%),
                linear-gradient(to right, rgba(6, 182, 212, 0.065) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(6, 182, 212, 0.065) 1px, transparent 1px);
            background-size: auto, auto, auto, 36px 36px, 36px 36px;
            animation: gridDrift 28s linear infinite;
        }

        .dark .architecture-bg {
            background-color: #050814;
            background-image:
                radial-gradient(circle at 12% 10%, rgba(34, 211, 238, 0.14), transparent 40%),
                radial-gradient(circle at 88% 15%, rgba(99, 102, 241, 0.14), transparent 42%),
                radial-gradient(circle at 78% 88%, rgba(16, 185, 129, 0.10), transparent 44%),
                linear-gradient(to right, rgba(56, 189, 248, 0.065) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(56, 189, 248, 0.065) 1px, transparent 1px);
            background-size: auto, auto, auto, 36px 36px, 36px 36px;
            animation: gridDrift 28s linear infinite;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(14, 165, 233, 0.35);
            border-radius: 9999px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(14, 165, 233, 0.7);
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @media screen {
            .paper-preview {
                position: relative;
                width: 100%;
                max-width: 210mm;
                min-height: 297mm;
                margin: 0 auto;
                background: #ffffff;
                color: #0f172a;
                font-family: "Calibri", "Carlito", "Montserrat", sans-serif;
                border: 1px solid rgba(14, 165, 233, 0.35);
                border-radius: 1.5rem;
                box-shadow: 0 30px 70px -20px rgba(14, 116, 144, 0.22), 0 0 0 6px rgba(255, 255, 255, 0.65);
                overflow-x: auto;
                transition: transform 0.3s ease, box-shadow 0.3s ease;
            }
            .dark .paper-preview {
                border-color: rgba(56, 189, 248, 0.45);
                box-shadow: 0 30px 70px -20px rgba(0, 0, 0, 0.8), 0 0 0 6px rgba(15, 23, 42, 0.7), 0 0 28px -8px rgba(56, 189, 248, 0.25);
            }
            .fun-architecture .paper-preview::before {
                content: '';
                position: absolute;
                inset: 10px;
                border: 1px dashed rgba(6, 182, 212, 0.28);
                border-radius: 14px;
                pointer-events: none;
            }
            .fun-architecture .paper-preview > * {
                position: relative;
                z-index: 1;
            }

            .fun-architecture .app-menu-bar {
                position: fixed !important;
                top: 0 !important;
                right: 0;
                left: 0;
                width: 100%;
                z-index: 60 !important;
                padding: 0.6rem 0.85rem;
                background: transparent !important;
                box-shadow: none !important;
                pointer-events: none;
            }
            .fun-architecture .hud-header-dock {
                pointer-events: auto;
                position: relative;
                overflow: hidden;
                background: rgba(255, 255, 255, 0.86);
                backdrop-filter: blur(24px) saturate(190%);
                -webkit-backdrop-filter: blur(24px) saturate(190%);
                border: 1px solid rgba(14, 165, 233, 0.28);
                box-shadow: 0 14px 36px -14px rgba(14, 116, 144, 0.22), inset 0 1px 0 0 rgba(255, 255, 255, 0.96);
                transition: all 0.32s cubic-bezier(0.16, 1, 0.3, 1);
            }
            .dark .fun-architecture .hud-header-dock {
                background: rgba(8, 14, 30, 0.86);
                backdrop-filter: blur(24px) saturate(190%);
                -webkit-backdrop-filter: blur(24px) saturate(190%);
                border-color: rgba(56, 189, 248, 0.28);
                box-shadow: 0 18px 42px -14px rgba(0, 0, 0, 0.85), inset 0 1px 0 0 rgba(56, 189, 248, 0.16);
            }
            .fun-architecture .hud-header-dock.is-scrolled {
                background: rgba(255, 255, 255, 0.94);
                border-color: rgba(6, 182, 212, 0.45);
                box-shadow: 0 20px 44px -14px rgba(14, 116, 144, 0.32), inset 0 1px 0 0 rgba(255, 255, 255, 1);
            }
            .dark .fun-architecture .hud-header-dock.is-scrolled {
                background: rgba(6, 11, 25, 0.94);
                border-color: rgba(34, 211, 238, 0.45);
                box-shadow: 0 22px 48px -14px rgba(0, 0, 0, 0.92), 0 0 24px -8px rgba(6, 182, 212, 0.25);
            }
            .fun-architecture .hud-header-beam {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                height: 2px;
                background: linear-gradient(90deg, transparent 0%, #06b6d4 20%, #2563eb 50%, #6366f1 80%, transparent 100%);
                background-size: 200% 100%;
                animation: gradientFlow 5s linear infinite;
                opacity: 0.85;
                pointer-events: none;
            }
            .fun-architecture .app-page-shell {
                padding-top: var(--app-menu-height, 5.25rem);
            }
            .fun-architecture .realtime-clock {
                min-width: max-content;
                background: linear-gradient(135deg, rgba(248, 250, 252, 0.9) 0%, rgba(236, 254, 255, 0.88) 100%);
                border-color: rgba(6, 182, 212, 0.28) !important;
                box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), 0 4px 14px -6px rgba(6, 182, 212, 0.22);
            }
            .dark .fun-architecture .realtime-clock {
                background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(7, 15, 32, 0.94) 100%);
                border-color: rgba(34, 211, 238, 0.28) !important;
                box-shadow: inset 0 1px 0 rgba(56, 189, 248, 0.14), 0 4px 16px -6px rgba(6, 182, 212, 0.28);
            }
        }
    </style>
</head>
<body class="fun-architecture architecture-bg text-slate-800 dark:text-slate-100 font-sans antialiased pb-12 print:p-0 print:bg-white print:text-black transition-colors duration-300">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // ==============================================================================
        // REACT-SAFE LUCIDE ICON COMPONENT (Mencegah konflik mutasi DOM React)
        // ==============================================================================
        const toPascalCase = (str) => {
            if (!str) return "";
            return str
                .split('-')
                .map(part => part.charAt(0).toUpperCase() + part.slice(1))
                .join('');
        };

        const renderLucideChildren = (children, keyPrefix = "el") => {
            if (!Array.isArray(children)) return null;
            return children.map((child, idx) => {
                if (!Array.isArray(child)) return null;
                const [tag, attrs = {}, grandChildren = []] = child;
                const reactProps = { ...attrs, key: `${keyPrefix}-${idx}` };
                if (reactProps.class) {
                    reactProps.className = reactProps.class;
                    delete reactProps.class;
                }
                return React.createElement(tag, reactProps, renderLucideChildren(grandChildren, `${keyPrefix}-${idx}`));
            });
        };

        const LucideIcon = ({ name, className = "w-4 h-4" }) => {
            const pascalName = toPascalCase(name);
            const iconDef = (window.lucide && window.lucide.icons) ? window.lucide.icons[pascalName] : null;

            if (!iconDef || !Array.isArray(iconDef)) {
                return (
                    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="9" />
                    </svg>
                );
            }

            let svgAttrs = {
                xmlns: "http://www.w3.org/2000/svg",
                width: 24,
                height: 24,
                viewBox: "0 0 24 24",
                fill: "none",
                stroke: "currentColor",
                strokeWidth: 2,
                strokeLinecap: "round",
                strokeLinejoin: "round",
                className: className,
                "aria-hidden": "true"
            };

            let childrenList = iconDef;
            if (typeof iconDef[0] === 'string' && iconDef[0] === 'svg') {
                const [, rawAttrs = {}, rawChildren = []] = iconDef;
                svgAttrs = { ...svgAttrs, ...rawAttrs, className };
                delete svgAttrs.class;
                childrenList = rawChildren;
            }

            return React.createElement('svg', svgAttrs, renderLucideChildren(childrenList, name));
        };

        // ==============================================================================
        // FUTURISTIC INTERACTIVE SPOTLIGHT & 3D TILT BENTO CARD
        // ==============================================================================
        const FuturisticBentoCard = ({ onClick, className = "", glowColor = "rgba(6, 182, 212, 0.18)", children }) => {
            const cardRef = useRef(null);
            const [spotlight, setSpotlight] = useState({ x: 0, y: 0, opacity: 0 });
            const [tilt, setTilt] = useState({ rotateX: 0, rotateY: 0 });

            const handleMouseMove = (e) => {
                if (!cardRef.current) return;
                const rect = cardRef.current.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const centerX = rect.width / 2;
                const centerY = rect.height / 2;
                const rotateX = ((y - centerY) / centerY) * -4.5;
                const rotateY = ((x - centerX) / centerX) * 4.5;
                setSpotlight({ x, y, opacity: 1 });
                setTilt({ rotateX, rotateY });
            };

            const handleMouseLeave = () => {
                setSpotlight(prev => ({ ...prev, opacity: 0 }));
                setTilt({ rotateX: 0, rotateY: 0 });
            };

            return (
                <div
                    ref={cardRef}
                    onClick={onClick}
                    onMouseMove={handleMouseMove}
                    onMouseLeave={handleMouseLeave}
                    style={{
                        transform: `perspective(1000px) rotateX(${tilt.rotateX}deg) rotateY(${tilt.rotateY}deg) translateY(${spotlight.opacity ? '-5px' : '0px'})`,
                        transition: spotlight.opacity ? 'transform 0.12s ease-out, box-shadow 0.3s ease, border-color 0.3s ease' : 'transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.3s ease, border-color 0.3s ease'
                    }}
                    className={`hud-frame glass-card group relative overflow-hidden cursor-pointer ${className}`}
                >
                    <div
                        className="pointer-events-none absolute -inset-px transition-opacity duration-300 z-0"
                        style={{
                            opacity: spotlight.opacity,
                            background: `radial-gradient(420px circle at ${spotlight.x}px ${spotlight.y}px, ${glowColor}, transparent 65%)`
                        }}
                    />
                    {children}
                </div>
            );
        };

        // ==============================================================================
        // ERROR BOUNDARY (Pemulihan Otomatis Jika Ada Data Tidak Valid)
        // ==============================================================================
        class AppErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, errorMessage: "" };
            }
            static getDerivedStateFromError(error) {
                return {
                    hasError: true,
                    errorMessage: (error && error.message) ? error.message : "Terjadi kesalahan rendering."
                };
            }
            componentDidCatch(error, info) {
                console.error("AppErrorBoundary caught error:", error, info);
            }
            handleRecover = () => {
                this.setState({ hasError: false, errorMessage: "" });
                if (this.props.onReset) this.props.onReset();
            };
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="min-h-screen flex items-center justify-center p-6">
                            <div className="animate-modal max-w-md w-full glass-card border border-red-200 dark:border-red-900/50 rounded-3xl p-8 text-center shadow-2xl space-y-5">
                                <div className="w-16 h-16 bg-red-50 dark:bg-red-950/60 text-red-500 rounded-2xl flex items-center justify-center mx-auto font-black text-2xl shadow-inner">!</div>

        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const startDate = new Date(start);

            if (isNaN(startDate.getTime()) || isNaN(endDate.getTime()) || endDate < startDate) return 0;

            let count = 0;
            let curDate = new Date(startDate.getTime());
            while (curDate <= endDate) {
                if (curDate.getDay() !== 0) count++;
                curDate.setDate(curDate.getDate() + 1);
            }
            return count;
        };

        const compressImageFile = (file, maxWidth = 550, maxHeight = 550) => {
            return new Promise((resolve, reject) => {
                if (!file || !file.type.startsWith('image/')) {
                    reject(new Error("File bukan gambar yang valid."));
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth || height > maxHeight) {
                            const ratio = Math.min(maxWidth / width, maxHeight / height);
                            width = Math.round(width * ratio);
                            height = Math.round(height * ratio);
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, width, height);
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedDataUrl = canvas.toDataURL('image/png');
                        resolve(compressedDataUrl);
                    };
                    img.onerror = () => reject(new Error("Gagal memproses gambar."));
                    img.src = event.target.result;
                };
                reader.onerror = () => reject(new Error("Gagal membaca file."));
                reader.readAsDataURL(file);
            });
        };

                const file = e.target.files[0];

                const reader = new FileReader();

                    try {
                        const parsed = JSON.parse(event.target.result);
                        const source = parsed.data ? parsed.data : parsed;

                        let nextSpk = [...daftarSpk];
                        let nextT30 = [...t30DaftarSpk];
                        let nextPo = [...poDaftar];
                        let nextPop = [...popDaftar];
                        let importedCount = 0;

                        const mergeById = (existing, incoming, prefix) => {
                            const sanitized = ensureItemIds(incoming, prefix);
                            const map = new Map(existing.map(item => [String(item.id), item]));
                            sanitized.forEach(item => {
                                map.set(String(item.id), item);
                                importedCount++;
                            });
                            return Array.from(map.values());
                        };

                        if (Array.isArray(source.BCA_DAFTAR_SPK)) nextSpk = mergeById(nextSpk, source.BCA_DAFTAR_SPK, "spk");
                        if (Array.isArray(source.BCA_DAFTAR_SPK_TIPE30)) nextT30 = mergeById(nextT30, source.BCA_DAFTAR_SPK_TIPE30, "t30");
                        if (Array.isArray(source.BCA_DAFTAR_PO)) nextPo = mergeById(nextPo, source.BCA_DAFTAR_PO, "po");
                        if (Array.isArray(source.BCA_DAFTAR_PO_PAVING)) nextPop = mergeById(nextPop, source.BCA_DAFTAR_PO_PAVING, "pop");

                        if (Array.isArray(source) && source.length > 0) {
                            const sample = source[0];
                            if ('t30NamaPemborong' in sample) nextT30 = mergeById(nextT30, source, "t30");
                            else if ('poTerimaDari' in sample) nextPo = mergeById(nextPo, source, "po");
                            else if ('popKepada' in sample) nextPop = mergeById(nextPop, source, "pop");
                            else nextSpk = mergeById(nextSpk, source, "spk");
                        } else if (source && typeof source === 'object' && !parsed.data && !source.BCA_DAFTAR_SPK && !source.BCA_DAFTAR_SPK_TIPE30 && !source.BCA_DAFTAR_PO && !source.BCA_DAFTAR_PO_PAVING) {
                            if ('t30NamaPemborong' in source) nextT30 = mergeById(nextT30, [source], "t30");
                            else if ('poTerimaDari' in source) nextPo = mergeById(nextPo, [source], "po");
                            else if ('popKepada' in source) nextPop = mergeById(nextPop, [source], "pop");
                            else if ('spkNumber' in source || 'proyekNama' in source) nextSpk = mergeById(nextSpk, [source], "spk");
                        }

                        if (importedCount === 0) {
                            showNotification("Tidak ditemukan data dokumen yang dikenali pada file JSON tersebut.", "error");
                            return;
                        }

                        const ok2 = saveToStorage('BCA_DAFTAR_SPK_TIPE30', nextT30);
                        const ok3 = saveToStorage('BCA_DAFTAR_PO', nextPo);

                            setPoDaftar(nextPo);
                            setPopDaftar(nextPop);
                            showNotification(`Berhasil mengimpor ${importedCount} dokumen dari JSON!`);
                        }

                        console.error(err);
                        showNotification("Format file JSON tidak valid atau rusak!", "error");

                                                <td>
                                                    <div className="space-y-6 pt-2">
                                                        <div className="text-center mb-8"><h1 className="font-serif text-xl font-bold tracking-[0.16em] uppercase text-slate-950 underline underline-offset-4">SURAT PERINTAH KERJA (SPK)</h1><p className="text-sm font-mono font-bold mt-2">Nomor : {spkNumber || "......................................................."}</p></div>
                                                        <div>
                                                            <h3 className="text-xs font-extrabold uppercase bg-slate-100 border border-slate-300 px-3 py-1.5 mb-2">A. INFORMASI PROYEK &amp; PELAKSANA</h3>
                                                            <table className="w-full text-[11pt] border-collapse">
                                                                <tbody>
                                                                    <tr><td className="py-1 px-2 font-semibold w-44">Nama Proyek</td><td className="py-1 w-4">:</td><td className="py-1 px-2 font-bold">{resolvedProyekName}</td></tr>
                                                                    <tr><td className="py-1 px-2 font-semibold">Lokasi Proyek</td><td className="py-1">:</td><td className="py-1 px-2">{resolvedProyekLokasi}</td></tr>
                                                                    <tr><td className="py-1 px-2 font-semibold">Pemberi Tugas</td><td className="py-1">:</td><td className="py-1 px-2">{pemberiTugas}</td></tr>
                                                                    <tr><td className="py-1 px-2 font-semibold">Penanggung Jawab</td><td className="py-1">:</td><td className="py-1 px-2 font-bold">{resolvedPjName}</td></tr>
                                                                    <tr><td className="py-1 px-2 font-semibold">Jabatan PJ</td><td className="py-1">:</td><td className="py-1 px-2">{resolvedPjJabatan}</td></tr>
                                                                    <tr><td className="py-1 px-2 font-semibold">Waktu Pelaksanaan</td><td className="py-1">:</td><td className="py-1 px-2">{startDate ? formatDateIndo(startDate) : "..."} s/d {endDate ? formatDateIndo(endDate) : "..."} <strong className="ml-2">({durasiHari} Hari Kerja)</strong></td></tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        <div>
                                                            <h3 className="text-xs font-extrabold uppercase bg-slate-100 border border-slate-300 px-3 py-1.5 mb-2">B. RUANG LINGKUP PEKERJAAN</h3>
                                                            <table className="w-full text-[11pt] border-collapse border border-slate-400">
                                                                <thead><tr className="bg-slate-200"><th className="border border-slate-400 py-1.5 px-2 text-center w-12">No</th><th className="border border-slate-400 py-1.5 px-3 text-left">Uraian Pekerjaan</th><th className="border border-slate-400 py-1.5 px-2 text-center w-24">Volume</th><th className="border border-slate-400 py-1.5 px-2 text-center w-24">Satuan</th></tr></thead>
                                                                <tbody>
                                                                    {ruangLingkup.length === 0 ? <tr><td colSpan="4" className="border border-slate-400 py-2 text-center text-slate-400 italic">Belum ada rincian pekerjaan.</td></tr> : ruangLingkup.map((item, idx) => (
                                                                        <React.Fragment key={item.id}>
                                                                            <tr><td className="border border-slate-400 py-1.5 px-2 text-center font-bold">{idx + 1}</td><td className="border border-slate-400 py-1.5 px-3 font-semibold">{item.uraian}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{item.volume}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{item.satuan}</td></tr>
                                                                            {(item.subs || []).map((sub, sIdx) => <tr key={sub.id}><td className="border border-slate-400 py-1 pl-4 pr-2 text-right font-mono text-xs">{idx + 1}.{sIdx + 1}</td><td className="border border-slate-400 py-1 pl-6 pr-3">{sub.uraian}</td><td className="border border-slate-400 py-1 px-2 text-center">{sub.volume}</td><td className="border border-slate-400 py-1 px-2 text-center">{sub.satuan}</td></tr>)}
                                                                        </React.Fragment>
                                                                    ))}
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        <div>
                                                            <h3 className="text-xs font-extrabold uppercase bg-slate-100 border border-slate-300 px-3 py-1.5 mb-2">C. KEBUTUHAN MATERIAL</h3>
                                                            <table className="w-full text-[11pt] border-collapse border border-slate-400">
                                                                <thead><tr className="bg-slate-200"><th className="border border-slate-400 py-1.5 px-2 text-center w-12">No</th><th className="border border-slate-400 py-1.5 px-3 text-left">Material</th><th className="border border-slate-400 py-1.5 px-2 text-center w-16">Qty</th><th className="border border-slate-400 py-1.5 px-2 text-center w-20">Satuan</th><th className="border border-slate-400 py-1.5 px-3 text-right w-32">Harga</th><th className="border border-slate-400 py-1.5 px-3 text-right w-36">Subtotal</th></tr></thead>
                                                                <tbody>
                                                                    {materials.length === 0 ? <tr><td colSpan="6" className="border border-slate-400 py-2 text-center text-slate-400 italic">Tidak ada kebutuhan material.</td></tr> : materials.map((m, idx) => <tr key={m.id}><td className="border border-slate-400 py-1.5 px-2 text-center">{idx + 1}</td><td className="border border-slate-400 py-1.5 px-3">{m.nama}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{m.qty}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{m.satuan}</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono">{formatRupiah(m.harga)}</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono font-semibold">{formatRupiah((Number(m.qty) || 0) * (Number(m.harga) || 0))}</td></tr>)}
                                                                    <tr className="bg-slate-100 font-bold"><td colSpan="5" className="border border-slate-400 py-1.5 px-3 text-right">SUBTOTAL MATERIAL</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono">{formatRupiah(totalMaterial)}</td></tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        <div>
                                                            <h3 className="text-xs font-extrabold uppercase bg-slate-100 border border-slate-300 px-3 py-1.5 mb-2">D. TENAGA KERJA ({laborType.toUpperCase()})</h3>
                                                            <table className="w-full text-[11pt] border-collapse border border-slate-400">
                                                                <thead><tr className="bg-slate-200"><th className="border border-slate-400 py-1.5 px-2 text-center w-12">No</th><th className="border border-slate-400 py-1.5 px-3 text-left">{laborType === 'harian' ? 'Tenaga Kerja' : 'Uraian'}</th><th className="border border-slate-400 py-1.5 px-2 text-center w-28">Satuan</th><th className="border border-slate-400 py-1.5 px-2 text-center w-20">Volume</th><th className="border border-slate-400 py-1.5 px-3 text-right w-32">Upah / Harga</th><th className="border border-slate-400 py-1.5 px-3 text-right w-36">Subtotal</th></tr></thead>
                                                                <tbody>
                                                                    {(laborType === 'harian' ? laborHarian : laborBorongan).map((item, idx) => <tr key={item.id}><td className="border border-slate-400 py-1.5 px-2 text-center">{idx + 1}</td><td className="border border-slate-400 py-1.5 px-3">{laborType === 'harian' ? item.tenaga : item.uraian}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{item.satuan}</td><td className="border border-slate-400 py-1.5 px-2 text-center">{item.volume}</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono">{formatRupiah(item.harga)}</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono font-semibold">{formatRupiah((Number(item.volume) || 0) * (Number(item.harga) || 0))}</td></tr>)}
                                                                    <tr className="bg-slate-100 font-bold"><td colSpan="5" className="border border-slate-400 py-1.5 px-3 text-right">SUBTOTAL TENAGA KERJA</td><td className="border border-slate-400 py-1.5 px-3 text-right font-mono">{formatRupiah(totalLabor)}</td></tr>
                                                                </tbody>
                                                            </table>
                                                        </div>
                                                        <div className="border-2 border-slate-900 bg-slate-100 p-3 print-avoid-break">
                                                            <div className="flex justify-between items-center text-sm font-black uppercase"><span>GRAND TOTAL ANGGARAN (C + D)</span><span className="font-mono text-base">{formatRupiah(grandTotal)}</span></div>
                                                            <p className="text-[11px] italic font-semibold mt-1 capitalize">Terbilang: {formatTerbilangRupiah(grandTotal) || "Nol rupiah"}</p>
                                                        </div>
                                                        <div className="pt-8 print-avoid-break">
                                                            <div className="grid grid-cols-4 gap-3 text-center text-[10pt] print-cols-4 items-end">
                                                                <div className="flex flex-col justify-between h-40">
                                                                    <p className="font-bold">Pemberi Tugas,</p>
                                                                    <p className="font-bold underline underline-offset-2">{pemberiTugas || "....................."}</p>
                                                                </div>
                                                                <div className="flex flex-col justify-between h-40 relative group">
                                                                    <p className="font-bold">Penanggung Jawab,</p>
                                                                    <div className="h-24 w-full flex items-center justify-center my-auto overflow-hidden">
                                                                        {pjSignatureImage && <img src={pjSignatureImage} className="signature-img max-h-24 max-w-[165px] object-contain mix-blend-multiply" />}
                                                                    </div>
                                                                    <p className="font-bold underline underline-offset-2">{resolvedPjName || "....................."}</p>
                                                                </div>
                                                                <div className="flex flex-col justify-between h-40">
                                                                    <p className="font-bold">Keuangan,</p>
                                                                    <p className="font-bold underline underline-offset-2">{keuanganName || "....................."}</p>
                                                                </div>
                                                                <div className="flex flex-col justify-between h-40">
                                                                    <p className="font-bold">Kepala Kantor,</p>
                                                                    <p className="font-bold underline underline-offset-2">{kepalaKantorName || "....................."}</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        function RootWrapper() {
            const [resetKey, setResetKey] = useState(0);
            return (
                <AppErrorBoundary onReset={() => setResetKey(prev => prev + 1)}>
                    <App key={resetKey} />
                </AppErrorBoundary>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<RootWrapper />);
    </script>
</body>
</html>
