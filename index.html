            { nama: "Lembah Bunder Regency", alamat: "Sidorahayu, Wagir", penerima: "Busro Khufidon", hp: "0821-4224-2120" },
            { nama: "Cinta Alam Residence", alamat: "Junrejo, Kota Batu", penerima: "Wahyu (Daok)", hp: "0856-9529-7970" },
            { nama: "Puri Firdaus", alamat: "Pendem, Kota Batu", penerima: "Agus Sutanto", hp: "0812-3456-7890" },
            { nama: "Griya Cinta Alam", alamat: "Karangploso, Malang", penerima: "Supardi", hp: "0813-3344-5566" }
        ];

        // ================= FUNGSI UTILITAS & KALKULASI =================
        const getRomanMonth = (monthIdx) => {
            const romans = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
            return romans[monthIdx] || "I";
        };

        const calculateWorkingDays = (start, end) => {
            if (!start || !end) return 0;
            const s = new Date(start);
            const e = new Date(end);
            if (isNaN(s.getTime()) || isNaN(e.getTime()) || e < s) return 0;
            const diffTime = Math.abs(e - s);
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
        };

        const formatRupiah = (angka) => {
            const num = parseFloat(angka);
            if (isNaN(num)) return "Rp 0";
            return "Rp " + new Intl.NumberFormat('id-ID').format(Math.round(num));
        };

        const terbilang = (nilai) => {
            const n = Math.floor(Math.abs(Number(nilai) || 0));
            const huruf = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (n < 12) return " " + huruf[n];
            if (n < 20) return terbilang(n - 10) + " belas";
            if (n < 100) return terbilang(Math.floor(n / 10)) + " puluh" + terbilang(n % 10);
            if (n < 200) return " seratus" + terbilang(n - 100);
            if (n < 1000) return terbilang(Math.floor(n / 100)) + " ratus" + terbilang(n % 100);
            if (n < 2000) return " seribu" + terbilang(n - 1000);
            if (n < 1000000) return terbilang(Math.floor(n / 1000)) + " ribu" + terbilang(n % 1000);
            if (n < 1000000000) return terbilang(Math.floor(n / 1000000)) + " juta" + terbilang(n % 1000000);
            if (n < 1000000000000) return terbilang(Math.floor(n / 1000000000)) + " miliar" + terbilang(n % 1000000000);
            return terbilang(Math.floor(n / 1000000000000)) + " triliun" + terbilang(n % 1000000000000);
        };

        const formatTerbilangRupiah = (angka) => {
            if (!angka || isNaN(angka)) return "";
            if (parseInt(angka) === 0) return "nol rupiah";
            return terbilang(parseInt(angka)).trim().replace(/\s+/g, ' ') + " rupiah";
        };

        const formatRpString = (angka) => {
            return 'Rp ' + new Intl.NumberFormat('id-ID').format(angka || 0);
        };

        const formatDateIndo = (dateStr) => {
            if(!dateStr) return "";
            const date = new Date(dateStr);
            if (isNaN(date.getTime())) return String(dateStr);
            const months = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}`;
        };

        const safeLoadArray = (key) => {
            try {
                const saved = localStorage.getItem(key);
                if (!saved) return [];
                const parsed = JSON.parse(saved);
                return Array.isArray(parsed) ? parsed.filter(item => item && typeof item === 'object') : [];
            } catch (e) {
                console.error(`Gagal membaca ${key}:`, e);
                return [];
            }
        };

        const ensureItemIds = (arr, prefix = "doc") => {
            if (!Array.isArray(arr)) return [];
            return arr
                .filter(item => item && typeof item === 'object')
                .map((item, idx) => ({
                    ...item,
                    id: item.id ? String(item.id) : `${prefix}-${Date.now()}-${idx}-${Math.floor(Math.random() * 1000)}`
                }));
        };

        const getLocalDateString = () => {
            const d = new Date();
            d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
            return d.toISOString().split('T')[0];
        };

        const getStorageUsageMB = () => {
            try {
                let total = 0;
                for (let key in localStorage) {
                    if (localStorage.hasOwnProperty(key)) {
                        total += ((localStorage[key].length + key.length) * 2);
                    }
                }
                return (total / (1024 * 1024)).toFixed(2);
            } catch (e) {
                return "0";
            }
        };

        const terbilangAngka = (angka) => {
            const num = parseInt(angka);
            if(isNaN(num)) return "";
            const words = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (num < 12) return words[num];
            if (num < 20) return words[num - 10] + " belas";
            if (num < 100) return words[Math.floor(num / 10)] + " puluh " + (words[num % 10] || "").trim();
            return "";
        };

        const DEFAULT_STATE = {

        };

        const BLOK_MAPPING = { A: 33, B: 12, C: 23, D: 7, E: 17, F: 20, G: 19, H: 26, I: 54, J: 55, K: 32, L: 55, M: 72, N: 16, O: 18, P: 17, Q: 20, R: 18, S: 10 };
        const generateNomorOptions = (huruf) => {
            const max = BLOK_MAPPING[huruf] || 0; const options = [];
            for (let i = 1; i <= max; i++) { if (i === 4) options.push("3A"); else if (i === 13) options.push("12A"); else options.push(i.toString()); }
            return options;
        };

        // ================= KOMPONEN ICON AMAN UNTUK REACT =================
        const LucideIcon = ({ name, className = "w-4 h-4" }) => {
            const containerRef = useRef(null);

            useEffect(() => {
                const el = containerRef.current;
                if (!el || !window.lucide) return;
                el.innerHTML = '';
                const i = document.createElement('i');
                i.setAttribute('data-lucide', name);
                if (className) i.setAttribute('class', className);
                el.appendChild(i);
                try {
                    window.lucide.createIcons({ root: el });
                } catch (err) {
                    console.warn('Lucide icon render warning:', name, err);
                }
            }, [name, className]);

            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0 leading-none" aria-hidden="true" />;
        };

        // ================= ERROR BOUNDARY PEMULIHAN OTOMATIS =================
        class AppErrorBoundary extends React.Component {
            constructor(props) {

            }
            static getDerivedStateFromError(error) {
                return { hasError: true, errorMessage: error?.message || "Terjadi kesalahan saat merender tampilan." };
            }
            componentDidCatch(error, info) {
                console.error("React ErrorBoundary caught error:", error, info);
            }
            render() {
                if (this.state.hasError) {

                if (!file.type.startsWith('image/')) {

                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        callback(canvas.toDataURL('image/png'), null);
                    };
                    img.onerror = () => callback(null, 'Gagal memuat gambar.');
                    img.src = e.target.result;
                };

                fileReader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (!parsed || typeof parsed !== 'object') {
                            throw new Error("Struktur JSON tidak valid");
                        }

                        const parseMaybeStringArray = (val) => {
                            if (Array.isArray(val)) return val;
                            if (typeof val === 'string') {
                                try {
                                    const inner = JSON.parse(val);
                                    return Array.isArray(inner) ? inner : null;
                                } catch (_) {
                                    return null;
                                }
                            }
                            return null;
                        };

                        let importedCount = 0;

                        // 1. Format Backup Standar atau Raw LocalStorage Keys
                        const spkList = parseMaybeStringArray(parsed.daftarSpk ?? parsed.BCA_DAFTAR_SPK);
                        const t30List = parseMaybeStringArray(parsed.t30DaftarSpk ?? parsed.BCA_DAFTAR_SPK_TIPE30);
                        const poList = parseMaybeStringArray(parsed.poDaftar ?? parsed.BCA_DAFTAR_PO);
                        const popList = parseMaybeStringArray(parsed.popDaftar ?? parsed.BCA_DAFTAR_PO_PAVING);

                        if (spkList) { setDaftarSpk(ensureItemIds(spkList, 'spk')); importedCount += spkList.length; }
                        if (t30List) { setT30DaftarSpk(ensureItemIds(t30List, 't30')); importedCount += t30List.length; }
                        if (poList) { setPoDaftar(ensureItemIds(poList, 'po')); importedCount += poList.length; }
                        if (popList) { setPopDaftar(ensureItemIds(popList, 'pop')); importedCount += popList.length; }

                        // 2. Jika file JSON berupa Array langsung (ekspor 1 modul)
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            const sample = parsed[0] || {};
                            const normalized = ensureItemIds(parsed, 'imp');
                            if ('t30NamaPemborong' in sample || 't30LokasiPekerjaanDetail' in sample) {
                                setT30DaftarSpk(normalized);
                            } else if ('poTerimaDari' in sample || 'poTableLeft' in sample) {
                                setPoDaftar(normalized);
                            } else if ('popKepada' in sample || 'popItems' in sample) {
                                setPopDaftar(normalized);
                            } else {
                                setDaftarSpk(normalized);
                            }
                            importedCount += normalized.length;
                        }

                        // 3. Jika file JSON berupa 1 dokumen tunggal
                        if (!Array.isArray(parsed) && !spkList && !t30List && !poList && !popList) {
                            const singleDoc = ensureItemIds([parsed], 'doc')[0];
                            if ('t30NamaPemborong' in parsed || 't30LokasiPekerjaanDetail' in parsed) {
                                setT30DaftarSpk(prev => [...prev, singleDoc]);
                                importedCount = 1;
                            } else if ('poTerimaDari' in parsed || 'poTableLeft' in parsed) {
                                setPoDaftar(prev => [...prev, singleDoc]);
                                importedCount = 1;
                            } else if ('popKepada' in parsed || 'popItems' in parsed) {
                                setPopDaftar(prev => [...prev, singleDoc]);
                                importedCount = 1;
                            } else if ('spkNumber' in parsed || 'proyekNama' in parsed || 'ruangLingkup' in parsed) {
                                setDaftarSpk(prev => [...prev, singleDoc]);
                                importedCount = 1;
                            }
                        }

                        if (importedCount > 0) {
                            showNotification(`Berhasil memulihkan ${importedCount} dokumen dari file JSON!`);
                        } else {
                            showNotification("File JSON terbaca, namun tidak ditemukan data dokumen yang dikenali.", "info");
                        }
                    } catch (err) {
                        console.error("Import JSON error:", err);
                        showNotification("Format file backup JSON tidak valid!", "error");
                    }
                };
                fileReader.readAsText(e.target.files[0]);
                e.target.value = '';
            };

            const handleClearAllStorage = () => {
                if (!confirmClear) {
                    setConfirmClear(true);
                    showNotification("Klik 'Konfirmasi Hapus' sekali lagi untuk mengosongkan memori.", "info");

                                                                <p>Selanjutnya disebut sebagai <strong>Pemborong/Pelaksana Pekerjaan</strong>, untuk melaksanakan pembangunan rumah di <strong>{t30LokasiPekerjaanDetail}</strong> sesuai dengan gambar kerja dan desain yang telah disetujui bersama, dengan ketentuan sebagai berikut:</p>

                                                                    <li className="pl-1 print-avoid-break">Apabila Pemborong tidak dapat menyelesaikan pekerjaan sampai dengan berakhirnya batas waktu pelaksanaan sebagaimana dimaksud pada angka 2, maka Pemborong dikenakan denda keterlambatan sebesar <strong>{formatRupiah(t30DendaKeterlambatan)} ({t30DendaKeterlambatanTerbilang || ".............................."}).</strong></li>

                                                                    <li className="pl-1 print-avoid-break">Pengambilan material di gudang hanya dapat dilakukan pada pukul <strong>{t30JamGudangPagiMulai || "07.30"}–{t30JamGudangPagiSelesai || "08.30"} WIB</strong> dan <strong>{t30JamGudangSiangMulai || "12.30"}–{t30JamGudangSiangSelesai || "13.30"} WIB.</strong></li>

                                    <div className="flex items-center gap-3"><label className="text-xs font-bold text-slate-500 dark:text-slate-400 uppercase">Mode SPK:</label><div className="flex bg-slate-100 dark:bg-slate-800 p-1 rounded-lg border dark:border-slate-700"><button onClick={() => setIsManualSpk(false)} className={`px-3 py-1.5 text-xs font-bold rounded-md ${!isManualSpk ? 'bg-blue-600 text-white' : 'text-slate-500 dark:text-slate-400'}`}>Otomatis</button><button onClick={() => setIsManualSpk(true)} className={`px-3 py-1.5 text-xs font-bold rounded-md ${isManualSpk ? 'bg-amber-500 text-white' : 'text-slate-500 dark:text-slate-400'}`}>Manual Edit</button></div></div>

                                                            <table className="ml-4 my-2 w-full"><tbody><tr><td className="w-32 align-top">Nama</td><td className="w-4 align-top">:</td><td className="font-bold">{pemberiTugas || "............................................"}</td></tr><tr><td className="align-top pt-1">Jabatan</td><td className="align-top pt-1">:</td><td className="pt-1">Pemberi Tugas</td></tr></tbody></table>
                                                            <p className="mb-2">Memberikan Perintah Kerja / Tugas kepada :</p>
                                                            <table className="ml-4 my-2 w-full"><tbody><tr><td className="w-32 align-top">Nama</td><td className="w-4 align-top">:</td><td className="font-bold">{resolvedPjObj?.nama || "............................................"}</td></tr><tr><td className="align-top pt-1">Jabatan</td><td className="align-top pt-1">:</td><td className="pt-1">{resolvedPjObj?.jabatan || "............................................"}</td></tr></tbody></table>
                                                        </div>

                                                        <div className="space-y-4">
                                                            <div>
                                                                <p className="font-bold border-b-2 border-black pb-1 mb-3 uppercase tracking-wider text-sm">A. Data Pekerjaan</p>
                                                                <table className="w-full mb-3 text-[11pt]"><tbody><tr><td className="w-40 py-1">Proyek / Lokasi</td><td>: <strong>{resolvedProyekName || "............................................"}</strong></td></tr><tr><td className="py-1">Waktu Pelaksanaan</td><td>: {startDate ? formatDateIndo(startDate) : "............."} <strong>s/d</strong> {endDate ? formatDateIndo(endDate) : "............."}</td></tr></tbody></table>
                                                            </div>
                                                            <div className="print-avoid-break mt-4">
                                                                <p className="font-bold border-b-2 border-black pb-1 mb-3 uppercase tracking-wider text-sm">B. Ruang Lingkup Pekerjaan</p>
                                                                {ruangLingkup.length > 0 ? (
                                                                    <table className="w-full border-collapse border border-black text-[10pt]">
                                                                        <thead><tr className="bg-slate-100"><th className="border border-black p-1.5 w-10 text-center">No</th><th className="border border-black p-1.5 text-left">Uraian Jenis Pekerjaan</th><th className="border border-black p-1.5 w-16 text-center">Vol</th><th className="border border-black p-1.5 w-16 text-center">Sat</th></tr></thead>
                                                                        <tbody>
                                                                            {ruangLingkup.map((item, parentIdx) => (
                                                                                <React.Fragment key={item.id}>
                                                                                    <tr className="bg-slate-50 font-bold">
                                                                                        <td className="border border-black p-1.5 text-center">{parentIdx + 1}</td>
                                                                                        <td className="border border-black p-1.5 uppercase">{item.uraian}</td>
                                                                                        <td className="border border-black p-1.5 text-center">{item.volume}</td>
                                                                                        <td className="border border-black p-1.5 text-center">{item.satuan}</td>
                                                                                    </tr>
                                                                                    {item.subs && item.subs.map((sub, subIdx) => (
                                                                                        <tr key={sub.id}>
                                                                                            <td className="border border-black p-1.5 text-right text-[9pt] pr-2">{parentIdx + 1}.{subIdx + 1}</td>
                                                                                            <td className="border border-black p-1.5">- {sub.uraian}</td>
                                                                                            <td className="border border-black p-1.5 text-center">{sub.volume}</td>
                                                                                            <td className="border border-black p-1.5 text-center">{sub.satuan}</td>
                                                                                        </tr>
                                                                                    ))}
                                                                                </React.Fragment>
                                                                            ))}
                                                                        </tbody>
                                                                    </table>
                                                                ) : (<div className="py-2 text-slate-400 italic text-sm">-- Ruang lingkup belum diisi --</div>)}
                                                            </div>

                                                            <div className="print-avoid-break mt-4">
                                                                <p className="font-bold border-b-2 border-black pb-1 mb-3 uppercase tracking-wider text-sm">C. Kebutuhan Material</p>
                                                                {materials.length > 0 ? (
                                                                    <table className="w-full border-collapse border border-black text-[10pt]">
                                                                        <thead><tr className="bg-slate-100"><th className="border border-black p-1.5 w-10 text-center">No</th><th className="border border-black p-1.5 text-left">Nama Material</th><th className="border border-black p-1.5 w-16 text-center">Qty</th><th className="border border-black p-1.5 w-16 text-center">Sat</th><th className="border border-black p-1.5 w-28 text-right">Harga (Rp)</th><th className="border border-black p-1.5 w-32 text-right">Jumlah (Rp)</th></tr></thead>
                                                                        <tbody>
                                                                            {materials.map((m, i) => (
                                                                                <tr key={m.id}>
                                                                                    <td className="border border-black p-1.5 text-center">{i + 1}</td>
                                                                                    <td className="border border-black p-1.5">{m.nama}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{m.qty}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{m.satuan}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(m.harga).replace('Rp', '')}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(m.qty * m.harga).replace('Rp', '')}</td>
                                                                                </tr>
                                                                            ))}
                                                                            <tr>
                                                                                <td colSpan="5" className="border border-black p-1.5 text-right font-bold bg-slate-50">SUBTOTAL MATERIAL</td>
                                                                                <td className="border border-black p-1.5 text-right font-bold bg-slate-50">{formatRupiah(totalMaterial)}</td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                ) : (<div className="py-2 text-slate-400 italic text-sm">-- Material belum diisi --</div>)}
                                                            </div>

                                                            <div className="print-avoid-break mt-4">
                                                                <p className="font-bold border-b-2 border-black pb-1 mb-3 uppercase tracking-wider text-sm flex justify-between"><span>D. Tenaga Kerja</span><span className="text-[10px] bg-slate-200 px-2 py-0.5 rounded font-mono">Sistem: {laborType.toUpperCase()}</span></p>
                                                                {(laborType === 'harian' && laborHarian.length > 0) || (laborType === 'borongan' && laborBorongan.length > 0) ? (
                                                                    <table className="w-full border-collapse border border-black text-[10pt]">
                                                                        <thead><tr className="bg-slate-100"><th className="border border-black p-1.5 w-10 text-center">No</th><th className="border border-black p-1.5 text-left">{laborType === 'harian' ? 'Tenaga Kerja' : 'Uraian Pekerjaan'}</th><th className="border border-black p-1.5 w-16 text-center">Vol</th><th className="border border-black p-1.5 w-20 text-center">Sat</th><th className="border border-black p-1.5 w-28 text-right">Harga (Rp)</th><th className="border border-black p-1.5 w-32 text-right">Jumlah (Rp)</th></tr></thead>
                                                                        <tbody>
                                                                            {laborType === 'harian' ? laborHarian.map((l, i) => (
                                                                                <tr key={l.id}>
                                                                                    <td className="border border-black p-1.5 text-center">{i + 1}</td>
                                                                                    <td className="border border-black p-1.5">{l.tenaga}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{l.volume}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{l.satuan}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(l.harga).replace('Rp', '')}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(l.volume * l.harga).replace('Rp', '')}</td>
                                                                                </tr>
                                                                            )) : laborBorongan.map((l, i) => (
                                                                                <tr key={l.id}>
                                                                                    <td className="border border-black p-1.5 text-center">{i + 1}</td>
                                                                                    <td className="border border-black p-1.5">{l.uraian}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{l.volume}</td>
                                                                                    <td className="border border-black p-1.5 text-center">{l.satuan}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(l.harga).replace('Rp', '')}</td>
                                                                                    <td className="border border-black p-1.5 text-right">{formatRupiah(l.volume * l.harga).replace('Rp', '')}</td>
                                                                                </tr>
                                                                            ))}
                                                                            <tr>
                                                                                <td colSpan="5" className="border border-black p-1.5 text-right font-bold bg-slate-50">SUBTOTAL TENAGA KERJA</td>
                                                                                <td className="border border-black p-1.5 text-right font-bold bg-slate-50">{formatRupiah(totalLabor)}</td>
                                                                            </tr>
                                                                        </tbody>
                                                                    </table>
                                                                ) : (<div className="py-2 text-slate-400 italic text-sm">-- Tenaga kerja belum diisi --</div>)}
                                                            </div>

                                                            <div className="print-avoid-break mt-6">
                                                                <table className="w-full border-collapse border-2 border-black text-[11pt]">
                                                                    <tbody>
                                                                        <tr><td className="border-2 border-black p-2 font-black uppercase w-2/3">E. TOTAL BIAYA KESELURUHAN (C + D)</td><td className="border-2 border-black p-2 text-right font-black text-[13pt] bg-slate-100">{formatRupiah(grandTotal)}</td></tr>
                                                                        <tr><td colSpan="2" className="border-2 border-black p-2 italic bg-slate-50">Terbilang: <span className="font-semibold capitalize">{formatTerbilangRupiah(grandTotal)}</span></td></tr>
                                                                    </tbody>
                                                                </table>
                                                            </div>

                                                            <div className="mt-8 text-[11pt] text-black print-avoid-break">
                                                                <p className="mb-4">Demikian Surat Perintah Kerja ini dibuat untuk dilaksanakan dengan penuh tanggung jawab.</p>
                                                                
                                                                <div className="grid grid-cols-4 gap-4 text-center mt-10 max-w-full mx-auto print-cols-4 text-[10pt] items-end h-32">
                                                                    <div className="flex flex-col justify-between h-[130px] relative group">
                                                                        <span className="font-bold mb-auto mt-0">Penerima Tugas,</span>
                                                                        {pjSignatureImage ? (
                                                                            <div className="flex items-center justify-center h-20 w-full overflow-hidden absolute inset-0 top-1/2 -translate-y-1/2 z-0"><img src={pjSignatureImage} className="signature-img max-h-full object-contain mix-blend-multiply opacity-90"/><label className="absolute inset-0 bg-white/80 flex flex-col items-center justify-center cursor-pointer opacity-0 group-hover:opacity-100 transition-opacity print:hidden rounded"><LucideIcon name="upload-cloud" className="w-4 h-4 text-blue-600 mb-1" /><span className="text-[9px] font-bold text-blue-700">Ubah TTD</span><input type="file" accept="image/*" className="hidden" onChange={handlePjSignatureUpload}/></label></div>
                                                                        ) : (
                                                                            <div className="relative z-10 w-full flex justify-center my-auto"><label className="cursor-pointer print:hidden flex flex-col items-center justify-center w-24 h-12 border border-dashed border-blue-400 hover:border-blue-600 rounded bg-blue-50"><span className="text-[8px] text-blue-600 font-bold">Upload TTD</span><input type="file" accept="image/*" className="hidden" onChange={handlePjSignatureUpload} /></label><div className="hidden print:block text-[10px] text-slate-400 italic py-4">Tanda Tangan</div></div>
                                                                        )}
                                                                        <div className="relative z-10 mt-auto"><span className="font-bold underline underline-offset-2 whitespace-nowrap block">{resolvedPjObj?.nama || "( ........................ )"}</span></div>
                                                                    </div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Pemberi Tugas,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{pemberiTugas || "Farizal Zainur Rozikin"}</p></div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Mengetahui,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{keuanganName || "Sita Dita Cahyani"}</p></div>
                                                                    <div className="flex flex-col justify-between h-[130px] relative"><p className="font-bold mb-auto mt-0">Menyetujui,</p><div className="hidden print:block text-[10px] text-slate-400 italic my-auto">Tanda Tangan</div><p className="font-bold underline underline-offset-2 whitespace-nowrap block mt-auto">{kepalaKantorName || "Fika Faradila Cahyanti"}</p></div>
                                                                </div>
                                                            </div>

                                                        </div>
                                                    </div>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </main>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <AppErrorBoundary onReset={() => window.location.hash = ''}>
                <App />
            </AppErrorBoundary>
        );
    </script>
</body>
</html>
